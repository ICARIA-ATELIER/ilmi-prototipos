<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto Planning Recovery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Layout: thin review bar on top, the 3840×2160 exhibit screen scaled to fit below it. */
:root {
  --bg: #e9e8e4; --fg: #1c1c1a; --muted: #5c5b57; --line: #cbc9c3; --ctl: #ffffff; --well: #d3d1cb;
  --ui: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ar: "Noto Sans Arabic", "Geeza Pro", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151514; --fg: #ebeae6; --muted: #a29f98; --line: #3a3936; --ctl: #242422; --well: #0d0d0c; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151514; --fg: #ebeae6; --muted: #a29f98; --line: #3a3936; --ctl: #242422; --well: #0d0d0c; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.ttl { display: flex; flex-direction: column; min-width: 0; }
.ttl strong { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.ttl span { font-size: 12px; color: var(--muted); }
.hint { flex: 1 1 220px; margin: 0; font-size: 13px; color: var(--muted); min-width: 0; }
.hint b { color: var(--fg); font-weight: 600; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctrls label { font-size: 12px; color: var(--muted); }
.ctl { display: inline-flex; align-items: center; gap: 8px; }
.ctrls select, .ctrls button { font: 500 13px var(--ui); color: var(--fg); background: var(--ctl); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.ctrls button:focus-visible, .ctrls select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.ctrls button:disabled { opacity: .45; cursor: default; }
.viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--well); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
.stage { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; transform-origin: 0 0; overflow: hidden; background: #dedede; font-family: var(--ui); color: #1a1712; user-select: none; -webkit-user-select: none; cursor: default; }
.stage.tap { cursor: pointer; }

/* --- exhibit screen (fixed grayscale wireframe look) --- */
.layer { position: absolute; inset: 0; background-size: 100% 100%; background-position: center; }
.ph { background-image: url("img/placeholder.png"); }
.before { background-image: url("img/before.jpg"); opacity: .3; }
.after { background-image: url("img/after.jpg"); }
.after.fadeable { transition: opacity 1.2s ease; }
.zone { position: absolute; inset: 0; background: url("img/after.jpg") center / 100% 100%;
  -webkit-mask-image: radial-gradient(circle 593px at var(--cx) var(--cy), #000 68%, transparent 100%);
          mask-image: radial-gradient(circle 593px at var(--cx) var(--cy), #000 68%, transparent 100%); }
.halo { position: absolute; width: 1150px; height: 1150px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(51,241,232,.42), rgba(51,241,232,.26) 55%, rgba(51,241,232,0)); }
.glow { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.92), rgba(255,255,255,0)); }
.abs { position: absolute; }
:where(button.abs) { font-family: var(--ui); border: 0; padding: 0; margin: 0; }
.stage button:focus-visible { outline: 14px solid #111; outline-offset: 10px; }

.label { display: flex; align-items: center; justify-content: center; min-height: 168px; padding: 40px 90px; box-sizing: border-box; text-align: center; color: #fff; font-weight: 500; font-size: 70px; line-height: 1.05; border-radius: 90px 90px 90px 0; background: linear-gradient(180deg, #4b4b4b, #2e2e2e); box-shadow: 0 18px 34px rgba(0,0,0,.28); cursor: pointer; transition: opacity .35s ease; }
.label.wide { max-width: 820px; }
.label.lit { box-shadow: 0 18px 34px rgba(0,0,0,.28), 0 0 90px 34px rgba(255,255,255,.75); animation: lit .7s ease-out both; }
@keyframes lit { from { box-shadow: 0 18px 34px rgba(0,0,0,.28), 0 0 0 0 rgba(255,255,255,0); } }
.label.solved { background: linear-gradient(180deg, #c6c6c6, #a8a8a8); font-weight: 700; font-size: 38px; min-height: 168px; padding: 40px 90px; border-radius: 90px 0 90px 90px; cursor: default; }
.label.solved.wide { max-width: 700px; }
.label.dim { opacity: .27; }
.badge { position: absolute; width: 68px; height: 68px; pointer-events: none; }
.label .badge { left: -22px; top: -18px; }

/* 17/11 · Variante «Inicio · con puzzle» (Montse): after Start, a placeholder text screen (Spanish, in red) and a puzzle
   where the four problem names are dragged (or tapped, then the zone tapped) onto their zones, each circled on the drawing.
   While a name is held, every free zone shows a dashed outline of that name where it would sit; the one under the finger
   lights up. Wrong zone or dropped outside: error sound and back to its place. Right: it lands on its map position and a
   success sound plays. Ring, dashed outline and sounds are provisional. */
/* 17/11 (later, Montse): the rings are dashed and softer; with a name over a zone the ring loses its line and only the
   dashed outline of the name and the turquoise (the same soft halo as the problem zone) are left. */
.ring { width: 640px; height: 640px; border-radius: 50%; box-sizing: border-box; background: transparent; border: 6px dashed rgba(46,46,46,.42) !important;
  cursor: pointer; z-index: 4; transition: border-color .2s; }
.ring.over, .ring.got { border-color: transparent !important; background: radial-gradient(closest-side, rgba(51,241,232,.42), rgba(51,241,232,.26) 55%, rgba(51,241,232,0)); }
/* Solved zone (Montse, 17/11): the ring goes but a little of the turquoise stays on the zone. */
.ring.got { opacity: .6; pointer-events: none; transition: opacity .4s ease; }
.slot { position: absolute; box-sizing: border-box; border: 8px dashed #2e2e2e; border-radius: 90px 90px 90px 0; background: rgba(255,255,255,.45); cursor: pointer; z-index: 5; animation: fade .2s ease-out both; }
.slot.over { border-color: #12a39c; background: rgba(51,241,232,.3); }
.label.drag { z-index: 10; touch-action: none; cursor: grab; }
.label.picked { transform: translateY(-14px) scale(1.04); box-shadow: 0 30px 50px rgba(0,0,0,.35), 0 0 0 10px rgba(51,241,232,.9); }
.label.dragging { z-index: 25; cursor: grabbing; transform: scale(1.06); box-shadow: 0 30px 50px rgba(0,0,0,.35); }
.label.placed { pointer-events: none; z-index: 10; }
.big.red { color: #e00000; }
.small { width: 1500px; text-align: center; font-weight: 500; font-size: 46px; line-height: 1.1; color: #333; pointer-events: none; }

.pill { height: 173px; border-radius: 177px; background: #fff; color: #1a1712; font-weight: 700; font-size: 43px; box-shadow: 0 16px 32px rgba(0,0,0,.13), 0 5px 10px rgba(0,0,0,.08); box-sizing: border-box; border: 1px solid #ebe6de !important; cursor: pointer; transition: opacity .3s ease; white-space: nowrap; }
.pill.sel { background: linear-gradient(180deg, #e2e2e2, #cfcfcf); border: 16px solid #636363 !important; }
.pill.wrong { border: 16px solid #c47474 !important; }
/* 12/11 (Montse's mock-up, Figma frame «107»): a wrong answer already tried on this problem stays white, greyed and struck through;
   a solution already used to fix another problem goes grey with a check at its top-left corner. Neither can be tapped. */
.pill .t { position: relative; display: inline-block; }
.pill.tried { color: #7f7f7f; cursor: default; pointer-events: none; }
.pill.tried .t::after { content: ""; position: absolute; left: -41px; right: -41px; top: 50%; height: 1px; background: #000; }
.pill.used { background: #dbdbdb; cursor: default; pointer-events: none; }
.pill .badge.used { left: -17px; right: auto; top: 0; width: 68px; height: 68px; }
/* 12/11 · Clue: button (magnifier with question mark + «Clue») next to the problem zone after the first wrong answer;
   tapping it opens the clue in a bubble that comes out of the button, and the magnifier turns into an X to close it
   (Montse, 12/11). The button stays for that problem. Look provisional. */
.cluebtn { height: 126px; padding: 0 60px 0 46px; border-radius: 63px; background: linear-gradient(180deg, #4b4b4b, #2e2e2e); color: #fff; display: inline-flex; align-items: center; gap: 18px; font-weight: 700; font-size: 46px; white-space: nowrap; cursor: pointer; box-shadow: 0 16px 30px rgba(0,0,0,.25); }
.cluebtn .ic { display: inline-flex; width: 68px; height: 68px; }
.cluebtn svg { width: 68px; height: 68px; }
@keyframes grow { from { transform: scale(.15); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes spin { from { transform: rotate(-90deg) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.a-grow { animation: grow .32s cubic-bezier(.2,.9,.3,1) both; }
.a-spin { animation: spin .25s ease-out both; }
.bubble.clue { width: 860px; padding: 60px 76px 70px; background: #fff; color: #0c0c0d; }
.bubble.clue h3 { display: flex; align-items: center; justify-content: center; gap: 16px; font-weight: 700; font-size: 72px; line-height: 1; margin-bottom: 22px; }
.bubble.clue h3 svg { width: 84px; height: 84px; }
.bubble.clue p { font-weight: 600; font-size: 56px; line-height: 1.1; }
.pill.fade { opacity: .66; }
.pill .badge { right: 0; top: -9px; }
.pill .badge.ko { width: 61px; height: 61px; top: -5px; }

.q { width: 1500px; text-align: center; font-weight: 700; font-size: 118px; line-height: .98; color: #000; pointer-events: none; text-wrap: balance; }
.name { border-radius: 171px; padding: 21px 57px; background: rgba(226,226,226,.72); color: #555; font-weight: 500; font-size: 61px; line-height: 1.05; cursor: pointer; white-space: nowrap; }
.desc { box-sizing: border-box; padding: 64px 72px; border-radius: 110px 110px 0 110px; background: linear-gradient(180deg, #dcdcdc, #c9c9c9); color: #383838; font-weight: 600; font-size: 38px; line-height: 1.2; text-align: center; box-shadow: 0 16px 30px rgba(0,0,0,.18); }
.cta { height: 172px; padding: 0 90px; border-radius: 90px 0 90px 90px; background: linear-gradient(180deg, #4b4b4b, #2e2e2e); color: #fff; font-weight: 700; font-size: 38px; white-space: nowrap; cursor: pointer; box-shadow: 0 16px 30px rgba(0,0,0,.25); }
.bubble { box-sizing: border-box; text-align: center; border-radius: 120px; box-shadow: 0 22px 44px rgba(0,0,0,.2); pointer-events: none; }
.desc.t-tr { border-radius: 110px 0 110px 110px; }
/* 18/11 · Nueva interactividad (Montse's mock-up): the description shows above the name just placed in the puzzle,
   its square corner (bottom left) over the name. */
.desc.t-bl { border-radius: 110px 110px 110px 0; pointer-events: none; }
/* 18/11 (later, Montse): after a right answer, a moment with a circle on the zone, where it is seen being restored
   (the restored drawing spreads out from the centre). Look and timings provisional. */
.rcircle { position: absolute; border-radius: 50%; box-sizing: border-box; border: 10px solid #12a39c; pointer-events: none;
  box-shadow: 0 0 46px 12px rgba(51,241,232,.6), inset 0 0 46px 12px rgba(51,241,232,.35); }
.rcircle.on { animation: pop .5s cubic-bezier(.2,.9,.3,1) both, rpulse 1.6s ease-in-out .5s infinite; }
@keyframes rpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
/* 18/11 · Intro cards of the nueva interactividad (Figma v6 «info-card-86''»): dark like the problem names, square
   corner top left, text 80 px ilmi → 70 px Roboto as the names. */
.icard { box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 36px 90px 40px;
  border-radius: 0 128px 128px 128px; background: linear-gradient(180deg, #4b4b4b, #2e2e2e); color: #fff; text-align: center;
  font-weight: 500; font-size: 70px; line-height: 1.06; box-shadow: 0 8px 16px rgba(0,0,0,.28); pointer-events: none; transform-origin: 0 0; }
/* 19/11 · Intro 2 nueva (Montse, Figma «↳ 18/11 · v7», «03 · Introduction 3» 807:13869): title and «Scientists follow
   three steps:», then the steps 1, 2 and 3 come out one by one, on a steady beat. Sizes and colours from Figma (Roboto
   there too). The movement is a proposal: each number pops, its pill unrolls out of it, and when the three are out the
   numbers beat once more, 1-2-3. */
.isub { text-align: center; font-weight: 600; font-size: 83.72px; line-height: 82.3px; color: #000; white-space: nowrap; pointer-events: none; }
.ipill { box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 0 78px 78px 78px;
  background: linear-gradient(180deg, #4b4b4b, #2e2e2e); box-shadow: 0 7px 14px rgba(0,0,0,.278); color: #fff; text-align: center;
  font-weight: 500; font-size: 55px; line-height: 60px; pointer-events: none; }
.ipill span { display: block; }
.inum { display: flex; align-items: center; justify-content: center; width: 126px; height: 126px; border-radius: 50%; background: #757575;
  color: #fff; font-weight: 500; font-size: 72px; line-height: 1; pointer-events: none; }
.ipill.on { animation: unroll .5s cubic-bezier(.25,.8,.3,1) both; }
.ipill.on span { animation: fade .35s ease-out .25s both; }
.inum.on { animation: shrinkin .55s cubic-bezier(.2,.8,.3,1) both; }   /* 19/11 (Montse): the number comes big and shrinks to its size */
.inum.beat { animation: beat .32s ease-in-out both; }
/* 19/11 noche (Montse, Figma «03 · Introduction 3» 807:13869 changed «para que no parecieran botones»): no pill any more.
   Each step is its grey number + its text alone (Ilmi Bold 96, #343330, -1 % in Figma → Roboto 700 at 0.79×), on a
   soft white glow (1127 × 280, the same radial white as the big one). Same movement: number big → its size, then
   its text comes out of it. */
.istep { font-weight: 700; font-size: 76px; line-height: 96px; color: #343330; letter-spacing: -.01em; text-align: center;
  white-space: nowrap; pointer-events: none; }
.istep.on { animation: unroll .5s cubic-bezier(.25,.8,.3,1) both, fade .45s ease-out both; }
/* 19/11 (Montse, Figma v7 «02 · Introduction 2–4», puzzle and the new «10 · Choose a problem»): each step gets its
   heading, a big grey number (193 px; 1 and 2 at 64 % in Figma, 3 at 100 %) and, for steps 1 and 3, its text (Ilmi
   SemiBold 113 #343330 in Figma → Roboto 600 at 0.79×). Same movement as the three steps: number big → its size, then
   its text comes out of it. */
.snum { position: absolute; width: 193px; height: 193px; pointer-events: none; }
.snum .inum { width: 193px; height: 193px; font-size: 110.29px; }
.shead { font-weight: 600; font-size: 89px; line-height: 87px; color: #343330; letter-spacing: -.01em; white-space: nowrap; pointer-events: none; }
.shead.c { text-align: center; }
.shead.on { animation: unroll .5s cubic-bezier(.25,.8,.3,1) both, fade .45s ease-out both; }
.mid { text-align: center; font-weight: 600; font-size: 83.72px; line-height: 82.3px; color: #000; pointer-events: none; }
.label.wait { opacity: .41; transition: opacity .5s ease; }
@keyframes unroll { from { clip-path: inset(-30px 100% -30px -30px); } to { clip-path: inset(-30px -30px -30px -30px); } }
@keyframes beat { 50% { transform: scale(1.14); } }
@keyframes shrinkin { from { transform: scale(2.6); opacity: 0; } 35% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
/* 18/11 · Variante «Fondo · movimiento leve en las intros» (Montse): while the intro texts are out, small orderly
   movement in the drawing. Intro 1: the dark river flows and its stain drifts downstream. Intro 2: the river goes on and
   the camels with riders walk a little; the grazing ones rock. Simulated, look and timings provisional. */
.fx { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; pointer-events: none; overflow: visible; }
.fx path { fill: none; stroke-linecap: round; }
.fx .glint { stroke: rgba(255,255,255,.7); stroke-width: 7; stroke-dasharray: 14 114; animation: flow 4s linear infinite; }
.fx .current { stroke: rgba(30,30,30,.16); stroke-width: 5; stroke-dasharray: 40 136; animation: flow 5.5s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -256; } }
.stain { position: absolute; left: 0; top: 0; width: 280px; height: 130px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(25,25,25,.34), rgba(25,25,25,.12) 60%, rgba(25,25,25,0));
  offset-rotate: auto; animation: drift 18s linear infinite, swell 4.5s ease-in-out infinite; }
@keyframes drift { 0% { offset-distance: 0%; opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@keyframes swell { 0%, 100% { transform: scale(.85, .8); } 50% { transform: scale(1.15, 1.1); } }
.cam { position: absolute; pointer-events: none; }
.cam img { display: block; width: 100%; height: 100%; }
.cam.graze { animation: graze 3.4s ease-in-out infinite; }
.cam.walk { animation: walkL 11s ease-in-out .6s both; }
.cam.walk img { animation: bob .8s ease-in-out infinite; }
@keyframes graze { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-8px); } }
@keyframes walkL { to { transform: translateX(-46px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
/* 18/11 (later, Montse): in order — first the stain for a while, then the diggers, then the camels. */
.fxwrap { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; pointer-events: none; transition: opacity 1.2s ease; }
.crane .body, .crane .arm { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.crane .arm { transform-origin: var(--px) var(--py); }
.crane.dig .arm { animation: dig 3.2s ease-in-out infinite; }
.crane.dig .body { animation: rumble .3s linear infinite; }
@keyframes dig { 0%, 100% { transform: rotate(0deg); } 35% { transform: rotate(-4.5deg); } 70% { transform: rotate(1.5deg); } }
@keyframes rumble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1px); } }
/* 18/11 (later, Montse) · Puzzle: while a description is out, a light veil over the rest of the drawing (the zone stays
   clear) and something moves in the zone. Blocked Tide: water running to the culvert and piling up against it. */
.focusveil { position: absolute; inset: 0; pointer-events: none; background: rgba(255,255,255,.55);
  -webkit-mask-image: radial-gradient(circle 560px at var(--cx) var(--cy), transparent 55%, #000 100%);
          mask-image: radial-gradient(circle 560px at var(--cx) var(--cy), transparent 55%, #000 100%); }
.fxwrap.fast .cam.walk { animation-duration: 4.5s; animation-delay: .1s; }
.fx .tide { stroke: rgba(30,30,30,.32); stroke-width: 7; stroke-dasharray: 34 70; animation: tide 2s linear infinite; }
@keyframes tide { to { stroke-dashoffset: 208; } }   /* 20/11 (Montse): the current ran the wrong way; now it flows from the culvert out to the right */
.fx .ripple { fill: none; stroke: rgba(30,30,30,.4); stroke-width: 5; transform-box: fill-box; transform-origin: center; animation: ripple 2.1s ease-out infinite; }
@keyframes ripple { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
/* 18/11 · Nueva interactividad (Figma v6, «Puzzle · 02»): the square corner of each name points to its zone. */
.label.k-tr { border-radius: 90px 0 90px 90px; } .label.k-tl { border-radius: 0 90px 90px 90px; }
.label.k-br { border-radius: 90px 90px 0 90px; } .label.k-bl { border-radius: 90px 90px 90px 0; }
/* 18/11 (Montse, final) · Pill size from Figma v6 754:9528, the reference for every screen of the variant: Pressure
   711 × 203, the others 156 high and as wide as in Figma; padding 37 / 83, radius 104, shadow 0 7 14; text set per pill
   in v6size() (ilmi 74 / 63 → Roboto 62 / 55, so each name fits its Figma width). Turquoise glow as in Figma: 31 px
   around, blur 43, 60 %. */
.label.v6 { padding: 37px 83px; box-shadow: 0 7px 14px rgba(0,0,0,.28); }
.label.v6.k-tr { border-radius: 104px 0 104px 104px; } .label.v6.k-tl { border-radius: 0 104px 104px 104px; }
.label.v6.k-br { border-radius: 104px 104px 0 104px; } .label.v6.k-bl { border-radius: 104px 104px 104px 0; }
.label.v6.solved { padding: 37px 83px; }
.label.v6.call::after { --glow-blur: 43px; --glow-spread: 31px; opacity: .65; }
/* 18/11 (Montse): in the puzzle, a name already placed is lighter and less visible than the ones still to place
   (after its description has gone). Proposal. */
.label.v6.done { background: linear-gradient(180deg, #d9d9d9, #c6c6c6); color: #444; box-shadow: 0 4px 10px rgba(0,0,0,.12); opacity: .8;
  transition: opacity .35s ease, background .35s ease, color .35s ease; }
.bubble h3, .bubble p { margin: 0; }
.bubble.t-tl { border-top-left-radius: 0; } .bubble.t-tr { border-top-right-radius: 0; }
.bubble.t-bl { border-bottom-left-radius: 0; } .bubble.t-br { border-bottom-right-radius: 0; }
.bubble.great { width: 998px; padding: 110px 89px; background: linear-gradient(180deg, #dedede, #c9c9c9); color: #0c0c0d; }
.bubble.great h3 { font-weight: 700; font-size: 144px; line-height: 1; margin-bottom: 30px; }
.bubble.great p { font-weight: 600; font-size: 59px; line-height: 1.08; }
.bubble.wrong { width: 948px; padding: 80px 64px 84px; background: #898989; }
.bubble.wrong h3 { font-weight: 700; font-size: 94px; line-height: 1; color: #fff; margin-bottom: 16px; }
.bubble.wrong p { font-weight: 600; font-size: 59px; line-height: 1.08; color: #e4e4e4; }
.bubble.fact { width: 791px; padding: 70px 83px; background: linear-gradient(180deg, #dedede, #c9c9c9); color: #0c0c0d; font-weight: 600; font-size: 38px; line-height: 1.15; }

  // 19/11 · Step headings (Montse, Figma v7): the number comes big and shrinks to its size; then its text comes out.

  // Something leaves (also with reduced motion, where the a-out animation is off).

  // Clue (12/11): after the first wrong answer on a problem, a «Clue» button shows under the problem name, by the zone.
  // Tapping it opens the clue in a bubble that comes out of the button, and the magnifier turns into an X (Montse, 12/11).
  // Tapping the X (the same button) or anywhere outside the bubble closes it and the magnifier comes back.
  function clue(k, nt, avoid, where) {
    const b = add(mk('button', 'abs cluebtn call', '<span class="ic">' + LENS + '</span><span>Clue</span>')); b.type = 'button';
    const ic = b.querySelector('.ic');
    b.setAttribute('aria-label', 'Clue: show the clue'); b.setAttribute('aria-expanded', 'false');
    if (where) where(b); // nueva interactividad: next to the chosen name, clear of the row of solutions
    else place(b, P[k].halo[0], nt.offsetTop + nt.offsetHeight + 40 + b.offsetHeight / 2);
    anim(b, 'a-pop');
    const icon = svg => { ic.classList.remove('a-spin'); ic.innerHTML = svg; void ic.offsetWidth; ic.classList.add('a-spin'); };
    let bub = null;
    const close = () => {
      if (!bub) return;
      const old = bub; bub = null;
      old.classList.remove('a-grow'); old.classList.add('a-out'); setTimeout(() => old.remove(), 320);
      icon(LENS); b.classList.remove('open');
      b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', 'Clue: show the clue');
      if (current.tap === close) current.tap = null;
      stage.classList.remove('tap');
    };
    on(b, () => {
      if (bub) { close(); return; }
      bub = clueBubble(k, b, nt, avoid, 'a-grow');
      bub.style.pointerEvents = 'auto';
      bub.addEventListener('click', ev => ev.stopPropagation()); // a tap on the clue itself keeps it open
      icon(XICON); b.classList.add('open');
      b.setAttribute('aria-expanded', 'true'); b.setAttribute('aria-label', 'Close the clue');
      current.tap = close; // a tap anywhere else on the screen closes it
      stage.classList.add('tap');
    });
  }
  // The bubble comes out of the Clue button: its square corner (the tail) sits right by the button and it grows from there.
  // First above or below the button (towards the centre of the screen first); if that covers the problem name, the
  // question or the answers, beside the button (level with it), clear of the problem name. It never covers Restart.
  function clueBubble(k, btn, nt, avoid, cls) {
    const b = add(mk('div', 'abs bubble clue', '<h3>' + LENS + 'Clue</h3><p>' + CLUES[k] + '</p>'));
    const w = b.offsetWidth, h = b.offsetHeight, gap = 28;
    const bx = btn.offsetLeft, by = btn.offsetTop, bw = btn.offsetWidth, bh = btn.offsetHeight;
    const boxes = avoid.concat([btn, nt]).map(e => [e.offsetLeft, e.offsetTop, e.offsetWidth, e.offsetHeight]).concat([MENU === 'visible' ? [0, 1480, 300, 640] : (MENU === 'solo' ? [0, 1800, 300, 320] : [0, 1700, 220, 200])]);
    const hit = (x, y) => boxes.reduce((s, [ex, ey, ew, eh]) => s + Math.max(0, Math.min(x + w, ex + ew) - Math.max(x, ex)) * Math.max(0, Math.min(y + h, ey + eh) - Math.max(y, ey)), 0);
    const low = by + bh / 2 > H / 2, east = bx + bw / 2 > W / 2;
    const vs = low ? ['up', 'down'] : ['down', 'up'], hs = east ? ['left', 'right'] : ['right', 'left'];
    const cands = [];
    for (const v of vs) for (const hz of hs)   // above / below, the tail corner over the button's edge
      cands.push({ x: hz === 'right' ? bx : bx + bw - w, y: v === 'up' ? by - gap - h : by + bh + gap,
                   tail: (v === 'up' ? 'b' : 't') + (hz === 'right' ? 'l' : 'r'),
                   origin: (hz === 'right' ? '0' : '100%') + ' ' + (v === 'up' ? '100%' : '0') });
    const right = Math.max(bx + bw, nt.offsetLeft + nt.offsetWidth) + gap, left = Math.min(bx, nt.offsetLeft) - gap - w;
    for (const hz of hs)                       // beside the button, level with it
      cands.push({ x: hz === 'right' ? right : left, y: low ? by + bh - h : by,
                   tail: (low ? 'b' : 't') + (hz === 'right' ? 'l' : 'r'),
                   origin: (hz === 'right' ? '0' : '100%') + ' ' + (low ? '100%' : '0') });
    let best = null;
    for (const c of cands) {
      c.x = Math.max(40, Math.min(W - 40 - w, c.x)); c.y = Math.max(40, Math.min(H - 40 - h, c.y));
      c.o = hit(c.x, c.y);
      if (!best || c.o < best.o) best = c;
      if (!c.o) break;
    }
    b.classList.add('t-' + best.tail);
    b.style.transformOrigin = best.origin;
    at(b, Math.round(best.x), Math.round(best.y));
    return anim(b, cls);
  }

  // Restart tab on the left edge: back to the start of the game (screen 28 in Figma).

  // 18/11 · Opción A de accesibilidad (Montse eligió la A): idioma y Restart siempre visibles, uno encima del otro en la

  let cfEl = null;

  const AV_INFO = '<b>Accessible</b> variant (option A, 18/11): language and Restart always visible at the bottom left, 240 × 240 px = 76 mm on the 55" (the guide asks for ≥ 75 mm), with 80 px = 25 mm between them; dark fill with a white border (contrast ≥ 3:1 on any background) and no blinking. Restart asks for confirmation. <b>Off-screen, pending:</b> raised mark on the frame, voice using the wristband’s vision profile, and height ~1050 mm from the floor (depends on the drawings).';

  const NEXT = {

        const ref = stage.querySelector('.ring'); stage.insertBefore(g, ref); stage.insertBefore(veil, ref);
        [g, veil].forEach(e => { e.style.transition = 'opacity .4s ease'; e.style.opacity = '0'; });
        requestAnimationFrame(() => requestAnimationFrame(() => { g.style.opacity = ''; veil.style.opacity = ''; }));
        focused = { hidden, g, veil };
      }
      function unfocus() {
        if (!focused) return;
        const { hidden, g, veil } = focused; focused = null;
        [g, veil].forEach(e => { e.style.opacity = '0'; setTimeout(() => e.remove(), 450); });
        hidden.forEach(e => { e.style.opacity = ''; });
      }
      function pick(key) {
        if (key) firstTouch();
        if (sel) L[sel].classList.remove('picked');
        sel = key;
        if (key) { L[key].classList.add('picked'); showSlots(L[key]); } else hideSlots();
      }
      function drop(key, k) {
        const b = L[key];
        pick(null); hideSlots();
        b.classList.remove('dragging');
        if (k === key) {
          free.delete(key);
          b.classList.remove('call', 'drag'); b.classList.add('placed'); b.tabIndex = -1;
          glide(b, P[k].label[0] - b.offsetWidth / 2, P[k].label[1] - b.offsetHeight / 2, 260);
          sound('ok');
          // 17/11 (Montse): once the name is in place, its ring goes and a little turquoise stays on the zone.
          const r = rings[k]; r.disabled = true; r.tabIndex = -1; r.classList.remove('a-pop', 'over'); r.style.animationDelay = ''; r.classList.add('got');
          // 18/11 · Nueva interactividad (Montse): its description comes out above the name once it lands, then goes.
          if (START === 'nueva') showDesc(k, b);
          else if (!free.size) auto(NEXT.puzzle, T.puzzleDone);
        } else {
          sound('ko');
          glide(b, ...home[key]);
          setTimeout(() => anim(b, 'a-shake'), 330);
        }
        showHint();
      }
      for (const k of ORDER) {
        const b = L[k];
        b.addEventListener('pointerdown', e => {
          if (!free.has(k) || e.button > 0 || busy) return;
          audio();
          const [x, y2] = toStage(e);
          drag = { b, sx: e.clientX, sy: e.clientY, gx: x - b.offsetLeft, gy: y2 - b.offsetTop, moved: false };
          try { b.setPointerCapture(e.pointerId); } catch (err) {}
        });
        b.addEventListener('pointermove', e => {
          if (!drag || drag.b !== b) return;
          if (!drag.moved) {
            if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
            drag.moved = true; pick(null); firstTouch(); b.classList.remove('a-pop', 'a-shake'); b.style.transition = 'none'; b.classList.add('dragging'); showSlots(b);
          }
          const [x, y2] = toStage(e); at(b, Math.round(x - drag.gx), Math.round(y2 - drag.gy));
          hover(zoneAt(x, y2, b));
        });
        b.addEventListener('pointerup', e => {
          if (!drag || drag.b !== b) return;
          const d = drag; drag = null;
          if (!d.moved) return;
          lastDrag = performance.now(); paused = false;
          const [x, y2] = toStage(e); drop(k, zoneAt(x, y2, b));
        });
        b.addEventListener('pointercancel', () => {
          if (!drag || drag.b !== b) return;
          const moved = drag.moved; drag = null;
          if (moved) { b.classList.remove('dragging'); hideSlots(); glide(b, ...home[k]); }
        });
        // A tap (or Enter) picks the name; a second tap lets it go. Then tapping a zone places it.
        b.addEventListener('click', ev => {
          ev.stopPropagation(); paused = false;
          if (performance.now() - lastDrag < 400 || !free.has(k) || busy) return;
          audio(); pick(sel === k ? null : k);
        });
      }
      return { hint: '<b>Drag each problem to its zone</b> (or tap it and then tap the zone). When you pick one up, the free spots show a dashed outline. Wrong zone or outside: error sound and it goes back to its place. Right: it settles into its place on the map and a success sound plays.' + (START === 'nueva' ? ' <b>New interactivity:</b> layout from Figma v6 (“Identify the challenges” with its <b>2</b>, which comes first, “Tap and drag” below it and the names in a row). When placed correctly, its description appears above it for ' + T.descShow / 1000 + ' s (provisional) and then disappears; while it is showing, the other names are hidden and come back when it goes. Tapping the drawing removes it sooner. With all four placed, it moves on to choosing a problem.' : '') + ' English texts: provisional translation, pending content.' };
    },
    // ---------- 18/11 · Nueva interactividad (Montse)
    // Choose a problem: the title, and the problems on the map (the unsolved ones glow; the solved ones grey with a check).
    choose(p) {
      bg('before'); zones();
      chooseTitle(p !== 'still'); // from step 3 the title is already there
      labels('choose');
      return { hint: '<b>Choose a problem</b> to find its solution. Solved ones appear in grey with a check. Title: provisional translation of “Selecciona un problema para aplicar la mejor solución”.' };
    },
    // The chosen problem stays alone (the others leave) and the four solutions come out in the same row as always.
    pick(k, enter) {
      bg('before'); zones(k); halo(k);
      const qt = chooseTitle(!!enter, SOL); // the new title fades in as the solutions come out
      if (enter) labels('gone', k);
      const nt = chosen(k);
      const ps = row(k, { pop: !!enter, click: key => key === P[k].correct ? go('nSel', k) : go('nWrongTap', k, key) });
      if (S.off[k].size) clue(k, nt, [qt, ...Object.values(ps)], b => {
        if (FB[k].clue === 'right') at(b, nt.offsetLeft + nt.offsetWidth + 40, Math.round(nt.offsetTop + (nt.offsetHeight - b.offsetHeight) / 2));
        else place(b, P[k].label[0], nt.offsetTop + nt.offsetHeight + 40 + b.offsetHeight / 2);
      });
      return { hint: '<b>Choose a solution.</b> They always appear in the same place. The ones already tried here and wrong are crossed out; the ones that already solved another problem are grey with a check. After the first wrong answer, <b>Clue</b> appears next to the problem. Tap the problem name to choose again (proposal, not confirmed).' };
    },
    nSel(k) {
      bg('before'); zones(k); halo(k);
      chooseTitle(false, SOL); chosen(k, false);
      row(k, { sel: P[k].correct, fadeOthers: true });
      auto(() => NEXT.nSel(k), T.toFeedback);
      return { tap: () => NEXT.nSel(k), hint: 'Right answer: the message appears by itself.' };
    },
    nGreat(k) {
      const d = P[k];
      bg('before'); zones(k); halo(k);
      chooseTitle(false, SOL); chosen(k, false);
      // The other answers leave as the message arrives (as before); the title stays.
      const ps = row(k, { sel: d.correct, fadeOthers: true });
      Object.keys(ps).filter(key => key !== d.correct).forEach(key => ps[key].classList.add('a-out'));
      fbBubble('great', d.right.h, d.right.p, k, null, 'a-rise');
      auto(() => NEXT.nGreat(k), T.second);
      return { tap: () => NEXT.nGreat(k), hint: 'The second message and the restored zone appear almost at the same time.' };
    },
    // 18/11 (later, Montse): the zone is no longer restored here, but in its own moment right after (nRestore).
    nFact(k) {
      const d = P[k];
      bg('before'); zones(k); halo(k);
      const qt = chooseTitle(false, SOL); chosen(k, false);
      const ps = row(k, { only: d.correct, sel: d.correct });
      const g = fbBubble('great', d.right.h, d.right.p, k);
      const f = fbBubble('fact', null, d.right.f, k, g, 'a-rise', 100);
      let leaving = false;
      const finish = () => {
        if (leaving) return; leaving = true;
        g.classList.add('a-out'); later(() => f.classList.add('a-out'), 260);
        // The title, the answer and the halo go too, so the next moment shows only the zone.
        [qt, ...Object.values(ps), ...stage.querySelectorAll('.glow, .halo')].forEach(e => e.classList.add('a-out'));
        later(() => NEXT.nFact(k), 620);
      };
      auto(finish, T.readRight);
      return { tap: () => { finish(); return true; }, hint: 'The messages stay for a few seconds and then the zone is restored (or <b>tap the screen</b>).' };
    },
    // 18/11 (later, Montse): a moment with a circle on the zone, where the drawing is seen changing to restored;
    // then back to choosing a problem.
    nRestore(k) {
      const d = P[k], c = d.zc || d.halo, R = 430;
      bg('before'); zones(k);
      const ring = add(mk('div', 'rcircle')); ring.style.width = ring.style.height = 2 * R + 'px'; place(ring, c[0], c[1], false); ring.classList.add('on');
      const nt = chosen(k, false); nt.classList.remove('call');
      later(() => revealZone(k, T.restore, ring), 300);
      let leaving = false;
      const finish = () => {
        if (leaving) return; leaving = true;
        ring.classList.remove('on'); ring.classList.add('a-out');
        later(() => NEXT.nRestore(k), 400);
      };
      auto(finish, 300 + T.restore + T.restoreHold);
      return { tap: () => { finish(); return true; }, hint: 'The zone is restored inside the circle (in the exhibit, the animation would play here) and it goes back to choosing a problem by itself (or <b>tap the screen</b>). Look and timings provisional.' };
    },
    nWrongTap(k, key) {
      bg('before'); zones(k); halo(k);
      chooseTitle(false, SOL); chosen(k, false);
      row(k, { wrong: key, shake: true });
      auto(() => NEXT.nWrongTap(k, key), T.toFeedback);
      return { tap: () => NEXT.nWrongTap(k, key), hint: 'Wrong answer: the reason appears by itself.' };
    },
    // The title, the problem and the chosen answer stay; the feedback comes out under the row.
    // 18/11 (later, Montse): with the feedback, the answers not chosen are hidden.
    nWrongFb(k, key) {
      const d = P[k], w = d.wrong[key];
      bg('before'); zones(k); halo(k);
      chooseTitle(false, SOL); chosen(k, false);
      const ps = row(k, { wrong: key });
      Object.keys(ps).filter(x => x !== key).forEach(x => ps[x].classList.add('a-out'));
      const m = fbBubble('wrong', w.h, w.p, k, null, 'a-rise');
      later(() => fbBubble('fact', null, w.f, k, m, 'a-rise'), T.second);
      auto(() => NEXT.nWrongFb(k, key), T.second + T.readWrong);
      return { tap: () => NEXT.nWrongFb(k, key),
               hint: 'The second message appears almost at the same time, and after 5 s it goes back to the solutions by itself, with that option crossed out and disabled.' + (w.note ? ' <b>Pending:</b> ' + w.note : '') };
    },
    map() {
      bg('before'); zones();
      // 17/11 · With the puzzle start, the map always has a title while problems remain (Montse).
      if (START === 'puzzle' && !allSolved()) {
        // 17/11 (Montse): lower down, and «Now» added.
        glow(1920, 900, 1900, 620);
        const h = add(mk('div', 'abs big', 'Now tap each one to find out what’s happening')); place(h, 1920, 900, false); anim(h, 'a-fade', 150);
      }
      labels('map');
      return allSolved() ? { tap: NEXT.map, hint: 'All solved. <b>Tap the screen</b>.' }
                         : { hint: '<b>Tap a problem</b> to see what is wrong with it.' + (START === 'puzzle' ? ' With the “with puzzle” start, the title always shows on the map while problems remain (provisional translation).' : '') };
    },
    desc(k) {
      const d = P[k];
      bg('before'); zones(k); halo(k);
      labels('dim', k);
      const c = add(mk('div', 'abs desc', d.desc.t)); if (d.desc.tail) c.classList.add('t-' + d.desc.tail); c.style.width = d.desc.w + 'px'; at(c, d.desc.x, d.desc.y); anim(c, 'a-rise');
      let b = null;
      const showCta = () => {
        if (b) return;
        b = add(mk('button', 'abs cta call', d.cta.t)); b.type = 'button'; at(b, d.cta.x, d.cta.y); anim(b, 'a-rise');
        on(b, () => NEXT.desc(k));
      };
      later(showCta, T.cta);
      return { tap: () => { showCta(); return true; }, hint: 'The description and, almost at the same time, the button. <b>Tap another problem</b> to see its description.' };
    },
    question(k) {
      bg('before'); zones(k); halo(k); const nt = nameTag(k); const [, qt] = question(k);
      const ps = pills(k, { click: key => key === P[k].correct ? go('sel', k) : go('wrongTap', k, key) });
      if (S.off[k].size) clue(k, nt, [qt, ...Object.values(ps)]);
      return { hint: '<b>Choose a solution.</b> The ones already tried here and wrong are crossed out; the ones that already solved another problem are grey with a check. After the first wrong answer, <b>Clue</b> appears next to the zone: the clue comes out of the button and the magnifier turns into an X; it closes with the X or by tapping outside. Tap the problem name to go back to its description.' };
    },
    sel(k) {
      bg('before'); zones(k); halo(k);
      question(k);
      pills(k, { sel: P[k].correct, fadeOthers: true });
      auto(() => NEXT.sel(k), T.toFeedback);
      return { tap: () => NEXT.sel(k), hint: 'Right answer: the message appears by itself.' };
    },
    great(k) {
      const d = P[k];
      bg('before'); zones(k); halo(k);
      // The question and the other answers leave as the message arrives, so it reads as the result of the tap.
      const q = question(k), ps = pills(k, { sel: d.correct, fadeOthers: true });
      [...q, ...Object.keys(ps).filter(key => key !== d.correct).map(key => ps[key])].forEach(e => e.classList.add('a-out'));
      bubble('great', d.right.h, d.right.p, { k, slot: 0 }, 'a-rise');
      auto(() => NEXT.great(k), T.second);
      return { tap: () => NEXT.great(k), hint: 'The second message and the restored zone appear almost at the same time.' };
    },
    fact(k) {
      const d = P[k];
      bg('before'); zones(k); zone(k, 1, 'a-slow'); halo(k);
      const g = bubble('great', d.right.h, d.right.p, { k, slot: 0 });
      const f = bubble('fact', null, d.right.f, { k, main: g }, 'a-rise', 100);
      let leaving = false;
      const finish = () => {
        if (leaving) return; leaving = true;
        g.classList.add('a-out'); later(() => f.classList.add('a-out'), 260); later(() => NEXT.fact(k), 620);
      };
      auto(finish, T.readRight);
      return { tap: () => { finish(); return true; }, hint: 'The zone is restored and it goes back to the map by itself (or <b>tap the screen</b>).' };
    },
    wrongTap(k, key) {
      bg('before'); zones(k); halo(k);
      question(k);
      pills(k, { wrong: key, shake: true });
      auto(() => NEXT.wrongTap(k, key), T.toFeedback);
      return { tap: () => NEXT.wrongTap(k, key), hint: 'Wrong answer: the reason appears by itself.' };
    },
    wrongFb(k, key) {
      const d = P[k], w = d.wrong[key];
      bg('before'); zones(k); halo(k);
      // Same moment: question and answers fade out while the message arrives.
      const q = question(k), ps = pills(k, { wrong: key });
      [...q, ...Object.values(ps)].forEach(e => e.classList.add('a-out'));
      const m = bubble('wrong', w.h, w.p, { k, slot: 0 }, 'a-rise');
      later(() => bubble('fact', null, w.f, { k, main: m }, 'a-rise'), T.second);
      auto(() => NEXT.wrongFb(k, key), T.second + T.readWrong);
      return { tap: () => NEXT.wrongFb(k, key),
               hint: 'The second message appears almost at the same time, and after 5 s it goes back to the question by itself, with that option crossed out and disabled.' + (w.note ? ' <b>Pending:</b> ' + w.note : '') };
    },
    done() {
      bg('before'); zones();
      const ls = labels('end');
      glow(1919, 1000, 1700, 640);
      // 19/11 (Montse, Figma v7 «20 · All problems solved»): «Good job!» bigger, Roboto Bold 160.
      const t = add(mk('div', 'abs big', 'Good job!')); t.style.fontSize = '160px'; place(t, 1919, 1016, false); anim(t, 'a-pop', 200);
      ls.forEach((b, i) => later(() => b.classList.add('a-out'), 800 + i * T.gap));
      later(() => t.classList.add('a-out'), 800 + ls.length * T.gap + 300);
      auto(NEXT.done, 800 + ls.length * T.gap + 700);
      return { tap: NEXT.done, hint: '“Good job!” (provisional text, pending content) and the problems disappear one by one.' };
    },
    recovery() {
      add(mk('div', 'layer ph'));
      const a = add(mk('div', 'layer after')); a.style.opacity = .6; anim(a, 'a-slow');
      // 18/11 (Montse): the bubbles come out more slowly — one every T.capGap, each taking 0.9 s; then 4 s to read the last one.
      ['pollution', 'pressure', 'blocked', 'coastal'].forEach((k, i) => bubble('fact', null, P[k].caption.t, P[k].caption.c, 'a-pop-slow', 300 + i * T.capGap));
      auto(NEXT.recovery, 300 + 3 * T.capGap + 900 + 4000);
      return { tap: NEXT.recovery, hint: 'The recovery sentences appear one by one (texts pending validation with content).' };
    },
    closing() {
      add(mk('div', 'layer ph'));
      const a = add(mk('div', 'layer after fadeable')); a.style.opacity = .6;
      const caps = ['pollution', 'pressure', 'blocked', 'coastal'].map(k => bubble('fact', null, P[k].caption.t, P[k].caption.c));
      caps.forEach((c, i) => later(() => c.classList.add('a-out'), 200 + i * T.gap));
      const gone = 200 + 3 * T.gap + 300;
      later(() => { a.style.opacity = .3; }, gone);
      const [t, s, b] = closingText();
      [t, s, b].forEach(e => { e.style.visibility = 'hidden'; });
      later(() => { t.style.visibility = ''; anim(t, 'a-fade'); }, gone + 100);
      later(() => { s.style.visibility = ''; anim(s, 'a-fade'); }, gone + 100 + 2 * T.gap);
      later(() => { b.style.visibility = ''; anim(b, 'a-pop'); }, gone + 100 + 4 * T.gap);
      return { hint: 'The sentences leave one by one; then the closing text, the question and finally <b>Play again</b> appear.' };
    }
  };

  // ---------- navigation
  const snap = () => ({ screen: S.screen, p: S.p, k: S.k, solved: [...S.solved], clue: [...S.clue], off: Object.fromEntries(ORDER.map(x => [x, [...S.off[x]]])) });
  function load(s) { S.screen = s.screen; S.p = s.p; S.k = s.k; S.solved = new Set(s.solved); S.clue = new Set(s.clue || []); for (const x of ORDER) S.off[x] = new Set(s.off[x]); }
  let current = { tap: null };
  function showHint() { hint.innerHTML = (paused ? '<b>Paused</b> (Back / Next, or tap the screen to continue). ' : '') + (current.hint || ''); }
  function render() {
    clearTimers();
    stage.replaceChildren();
    stillEl = null; menuOpen = false; cfEl = null;
    current = SCREENS[S.screen](S.p, S.k) || {};
    if (!['idle', 'intro', 'introA', 'introB', 'step1', 'closing'].includes(S.screen)) ({ solo: menuSolo, visible: menuVisible, goo: menuGoo, tab: restartTab }[MENU] || menuSolo)();
    stage.classList.toggle('tap', !!current.tap);
    showHint();
    armStill();
    cur = snap();
    backBtn.disabled = !past.length;
  }
  function go(screen, p = null, k = null) {
    if (cur) past.push(cur);
    future = [];
    S.screen = screen; S.p = p; S.k = k;
    render();
  }
  function back() { if (!past.length) return; paused = true; future.push(cur); load(past.pop()); render(); }
  function fwd() {
    paused = true;
    if (future.length) { past.push(cur); load(future.pop()); render(); }
    else NEXT[S.screen](S.p, S.k);
  }
  function reset() { S = fresh(); LANG = 'en'; past = []; future = []; cur = null; paused = false; render(); }

  // Any touch restarts the "are you still there?" countdown.
  stage.addEventListener('pointerdown', () => { if (!stillEl) armStill(); });
  stage.addEventListener('click', () => {
    if (stillEl) return;
    const was = paused; paused = false;
    if (current.tap) { const keep = current.tap(); if (keep) current.tap = null; }
    else if (was) render();
  });
  backBtn.addEventListener('click', back);
  fwdBtn.addEventListener('click', fwd);
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('select')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); fwd(); }
    else if ((e.key === 'Enter' || e.key === ' ') && current.tap && !stillEl && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); paused = false; const keep = current.tap(); if (keep) current.tap = null; }
  });

  // review controls
  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('jump').addEventListener('change', e => {
    const v = e.target.value; e.target.value = '';
    if (!v) return;
    paused = false;
    if (v === 'still') { if (!WAITS.includes(S.screen) || allSolved()) { if (allSolved()) S = fresh(); go('choose'); } showStill(); }
    else if (v === 'confirm') {
      if (['idle', 'intro', 'introA', 'introB', 'step1', 'closing'].includes(S.screen)) { S = fresh(); go('choose'); } else render();
      confirmRestart();
    }
    else if (v === 'choose') {
      if (allSolved()) S = fresh();
      go('choose');
    }
    else if (P[v]) { S.solved.delete(v); S.off[v].clear(); S.clue.delete(v); START === 'nueva' ? go('pick', v, 'enter') : go('desc', v); }
    else if (['done', 'recovery', 'closing'].includes(v)) { ORDER.forEach(k => S.solved.add(k)); go(v); }
    else go(v);
  });

  // scale the 3840×2160 screen into the viewport
  function fit() {
    const cs = getComputedStyle(viewport);
    const pw = viewport.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ph = viewport.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const s = Math.max(0.01, Math.min(pw / W, ph / H));
    const x = parseFloat(cs.paddingLeft) + (pw - W * s) / 2, y = parseFloat(cs.paddingTop) + (ph - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  }
  new ResizeObserver(fit).observe(viewport); fit();

  // 19/11: load every weight before the first screen (the browser only loads a weight when it is first used, and the
  // «loadingdone» re-render below would restart an animated screen halfway through).
  const fontsIn = document.fonts ? Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(w + ' 80px Roboto')).concat(['500', '700'].map(w => document.fonts.load(w + ' 80px "Noto Sans Arabic"', 'ع')))).catch(() => {}).then(() => document.fonts.ready) : Promise.resolve();
  fontsIn.then(render, render);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { if (['idle', 'intro', 'introA', 'introB', 'step1', 'step3', 'text', 'map', 'question', 'choose', 'pick'].includes(S.screen)) render(); });
})();
</script>

:root{--navy:#1f3557;--navy2:#2c4a75;--ink:#2b2b2b;--ok:#2e8b57;--ko:#d64545;--prov:#f08c1e;
--bg:#e9e8e4;--fg:#1c1c1a;--muted:#5c5b57;--rline:#cbc9c3;--ctl:#ffffff;--well:#d3d1cb;--ui:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151514;--fg:#ebeae6;--muted:#a29f98;--rline:#3a3936;--ctl:#242422;--well:#0d0d0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--fg:#ebeae6;--muted:#a29f98;--rline:#3a3936;--ctl:#242422;--well:#0d0d0c;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
/* ===== Review bar (same pattern as the other ILMI prototypes) ===== */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rline)}
.ttl{display:flex;flex-direction:column;min-width:0;max-width:420px}
.ttl strong{font-size:15px;font-weight:700;letter-spacing:.01em}
.ttl span{font-size:12px;color:var(--muted)}
.hint{flex:1 1 240px;font-size:13px;line-height:1.4;color:var(--muted);min-width:0}
.hint b{color:var(--fg);font-weight:600}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls label{font-size:12px;color:var(--muted)}
.ctl{display:inline-flex;align-items:center;gap:8px}
.ctrls select,.ctrls button{font:500 13px var(--ui);color:var(--fg);background:var(--ctl);border:1px solid var(--rline);border-radius:8px;padding:6px 10px;cursor:pointer;max-width:240px}
.ctrls button:focus-visible,.ctrls select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ctrls button:disabled{opacity:.45;cursor:default}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--well);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== Exhibit screen, 1920 x 1080 ===== */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#eee;color:var(--ink);font-family:Inter,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#stage button{font-family:inherit;color:inherit}
#screen{position:absolute;inset:0;transition:opacity .25s}
#screen.fade{opacity:0}

.glow{position:absolute;background:radial-gradient(ellipse at center,rgba(255,255,255,.97) 38%,rgba(255,255,255,.85) 52%,rgba(255,255,255,0) 71%)}
h1.t{font-size:56px;font-weight:600;line-height:1.12;letter-spacing:-.5px;text-wrap:balance}
.body{font-size:32px;line-height:1.38;color:#333;text-wrap:pretty}
.btn{position:relative;flex:none;height:88px;padding:0 46px;border-radius:44px;border:none;font:600 34px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;white-space:nowrap;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff!important;box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 0 5px rgba(255,255,255,.85)}
.btn.primary[disabled]{background:#c5d0dc;color:#2c4a75!important;box-shadow:none;cursor:default}
.btn.ghost{background:#fff;color:var(--navy)!important;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.badge{position:absolute;background:var(--prov);color:#fff;font:700 15px Inter;padding:6px 12px;border-radius:8px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
@media (prefers-reduced-motion: reduce){#stage *{animation:none!important;transition:none!important}.seq{opacity:1!important}}

/* attract */
.kb{animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-40px,-20px)}}
.pawtrk i{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;color:#2b2b2b;opacity:0;animation:pawK 9s linear infinite;animation-delay:var(--d)}
@keyframes pawK{0%{opacity:0}3%{opacity:.6}30%{opacity:.6}38%{opacity:0}100%{opacity:0}}
.flashA{position:absolute;inset:0;background:#fff;opacity:0;animation:flashA 9s linear infinite;pointer-events:none}
@keyframes flashA{0%,33%{opacity:0}34%{opacity:.85}38%{opacity:0}100%{opacity:0}}
.camA{position:absolute;left:1560px;top:170px;width:120px;height:120px;border-radius:50%;background:var(--navy);border:6px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
/* idle: same as the other ILMI prototypes («Scan your wristband or tap to start» + reader rings, bottom right) */
.tq{position:absolute;right:0;top:830px;width:700px;height:250px;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.scan{position:absolute;right:104px;top:932px;font:600 28px/36px Inter;color:var(--ink);white-space:nowrap}
.rf{position:absolute;border-radius:50%;border:solid var(--ink);box-sizing:border-box}

/* intro: 3 story cards */
.seq{opacity:0;animation:seqIn .6s ease forwards;animation-delay:var(--d,0s)}
@keyframes seqIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.st-dim{position:absolute;inset:0;background:rgba(20,26,40,.42)}
.st-card{position:absolute;left:400px;top:80px;width:1120px;background:#fff;border-radius:32px;padding:26px 40px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:stUp .5s ease both;z-index:5}
@keyframes stUp{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
.st-bars{display:flex;gap:10px}
.st-bars i{flex:1;height:8px;border-radius:4px;background:#e2e5ea;overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:var(--navy)}
.st-bars i.done b{width:100%}
.st-bars i.cur b{animation:stfill var(--dur) linear forwards}
@keyframes stfill{to{width:100%}}
.st-anim{position:relative;margin-top:20px;height:500px;border-radius:22px;overflow:hidden;background:#ddd}
.st-card p{font:500 38px/1.3 Inter;color:#222;margin-top:24px;text-wrap:balance;height:150px;display:flex;align-items:center}
.st-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;height:88px}
.st-foot .k{font:700 20px Inter;letter-spacing:.8px;color:#888}
.st-foot .tap{font:600 28px Inter;color:var(--navy);background:#eef2f7;padding:14px 30px;border-radius:999px}
.st-night{position:absolute;inset:0;background:rgba(14,22,46,0);animation:stNight 2.2s ease forwards}
@keyframes stNight{to{background:rgba(14,22,46,.84)}}
.eyes{position:absolute;left:700px;top:180px;display:flex;gap:34px;opacity:0;animation:eyes 4s ease 1.6s infinite}
.eyes i{width:30px;height:16px;border-radius:50%;background:#ffe36a;box-shadow:0 0 18px 6px rgba(255,227,106,.7)}
@keyframes eyes{0%{opacity:0}10%{opacity:1}40%{opacity:1}44%{opacity:0}48%{opacity:1}75%{opacity:1}90%,100%{opacity:0}}
.st-paws i{position:absolute;color:#fff;opacity:0;animation:pawN 4s ease infinite;animation-delay:var(--d)}
@keyframes pawN{0%{opacity:0}15%{opacity:.6}60%{opacity:.6}100%{opacity:0}}
.st-cam{position:absolute;left:445px;top:70px;width:150px;height:150px;border-radius:24px;background:#5b4a32;border:6px solid #2b2b2b;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:camDrop .8s cubic-bezier(.3,1.4,.6,1) .2s both}
@keyframes camDrop{from{opacity:0;transform:translateY(-200px) rotate(-12deg)}to{opacity:1;transform:none}}
.st-cam::after{content:'';position:absolute;right:14px;top:14px;width:14px;height:14px;border-radius:50%;background:#ff4d4d;animation:rec 1s steps(2) infinite}
@keyframes rec{50%{opacity:0}}
.st-beam{position:absolute;left:470px;top:220px;width:100px;height:230px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.st-walk{position:absolute;top:330px;left:-260px;color:#2b2b2b;animation:walk 3.6s linear 1s infinite}
@keyframes walk{from{transform:translateX(0);opacity:0}10%{opacity:.85}90%{opacity:.85}to{transform:translateX(1300px);opacity:0}}

<script>
/* ================= CONFIG ================= */
const CAMS_PER_DAY = 3;          // final: always 3 camera-traps per day (3 days)
let INACTIVITY = false;          // off by default; Variants

function blobPath(cx,cy,rx,ry,rot,seed){

 for(let i=0;i<N;i++){const t=i/N*2*Math.PI,k=1+(r()-.5)*.14;const u=Math.cos(t)*rx*k,v=Math.sin(t)*ry*k;

 let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
 for(let i=0;i<N;i++){const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
  const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

// Put the place note next to its spot, on the side where it covers nothing else.
function placeInfo(){const el=$('#pinfo');if(!el)return;if(!S.info||!S.placed.includes(S.info)||S.alb){el.remove();return;}
 const s=spotById(S.info);el.innerHTML=`<small>CAMERA-TRAP PLACED</small><b>${s.name}</b><span>${s.info}</span>`;
 const st=$('#stage').getBoundingClientRect();const R_=e=>{const r=e.getBoundingClientRect();return {l:(r.left-st.left)/K,t:(r.top-st.top)/K,r:(r.right-st.left)/K,b:(r.bottom-st.top)/K};};
 const obs=[...scr.querySelectorAll('.spot .c,.spot .tag,.prompt,.clues,.dock')].map(R_);
 const w=470,h=el.offsetHeight,g=10;
 // search the whole map area on a 12 px grid: nearest position to the spot that covers nothing
 let best=null;for(let l=24;l<=1896-w;l+=12)for(let t=24;t<=1056-h;t+=12){const b={l,t,r:l+w,b:t+h};
  const dx=Math.max(b.l-s.x,0,s.x-b.r),dy=Math.max(b.t-s.y,0,s.y-b.b);
  let sc=Math.hypot(dx,dy)+Math.hypot((b.l+b.r)/2-s.x,(b.t+b.b)/2-s.y)*.15;if(best&&sc>=best.sc)continue;
  for(const o of obs){const ox=Math.min(b.r,o.r+g)-Math.max(b.l,o.l-g),oy=Math.min(b.b,o.b+g)-Math.max(b.t,o.t-g);if(ox>0&&oy>0){sc+=1e4+ox*oy*10;if(best&&sc>=best.sc)break;}}
  if(!best||sc<best.sc)best={sc,c:{l,t}};}
 el.style.left=Math.round(best.c.l)+'px';el.style.top=Math.round(best.c.t)+'px';el.classList.add('on');}

 const s=S.screen;
 if(s==='idle'){newGame();go('intro');}
 else if(s==='intro'){clearTimers();if(S.story<STORIES.length-1){S.story++;render();}else go('map');}
 else if(s==='map'){if(!S.tipSeen)doAct('tipok');else if(S.placed.length<need()){const id=DEMO_ORDER.find(i=>!S.done.includes(i)&&!S.placed.includes(i));tapSpot(id);}else runNight();}
 else if(s==='results'){const nx=S.placed.find(i=>!S.opened.includes(i));if(nx)openCam(nx);else if(freeSpots().length)doAct('nextday');else go('end');}
 else if(s==='end'){newGame();go('idle');}}
// Go to
function playDays(n,openLast=true){newGame();S.tipSeen=true;const per=CAMS_PER_DAY;
 for(let d=1;d<=n;d++){const ids=DEMO_ORDER.filter(i=>!S.done.includes(i)).slice(0,per);S.day=d;S.placed=ids;S.done.push(...ids);S.opened=[];
  if(d<n||openLast)ids.forEach(id=>{S.opened.push(id);S.album.push({id,day:d});if(id===LEOPARD)S.foundDay=d;});}}
const lastDay=()=>maxDays();
const leoDay=()=>Math.ceil((DEMO_ORDER.indexOf(LEOPARD)+1)/CAMS_PER_DAY);
const JUMPS=[
 ['01 · Attract',()=>{newGame();S.screen='idle';}],
 ['02 · Intro 1/3',()=>{newGame();S.screen='intro';S.story=0;}],
 ['03 · Intro 2/3',()=>{newGame();S.screen='intro';S.story=1;}],
 ['04 · Intro 3/3',()=>{newGame();S.screen='intro';S.story=2;}],
 ['05 · Map · tip card',()=>{newGame();S.screen='map';}],
 ['06 · Map · day 1, empty',()=>{newGame();S.tipSeen=true;S.screen='map';}],
 ['07 · Map · day 1, cameras placed',()=>{newGame();S.tipSeen=true;S.screen='map';S.placed=DEMO_ORDER.slice(0,CAMS_PER_DAY);S.info=S.placed[S.placed.length-1];}],
 ['08 · Morning · cameras closed',()=>{playDays(1,false);S.screen='results';}],
 ['09 · Morning · one open',()=>{playDays(1,false);const id=S.placed[0];S.opened=[id];S.album.push({id,day:1});S.lastNew=id;S.screen='results';}],
 ['10 · Morning · all open, no leopard',()=>{playDays(1);S.screen='results';}],
 ['11 · Album · over the morning',()=>{playDays(1);S.screen='results';S.alb={v:'grid'};}],
 ['12 · Map · day 2 (clues on checked spots)',()=>{playDays(1);S.day=2;S.placed=[];S.opened=[];S.screen='map';}],
 ['13 · Album · over the map',()=>{playDays(1);S.day=2;S.placed=[];S.opened=[];S.screen='map';S.alb={v:'grid'};}],
 ['14 · Album · photo enlarged',()=>{playDays(1);S.day=2;S.placed=[];S.opened=[];S.screen='map';S.alb={v:'photo',id:S.album[0].id};}],
 ['15 · Morning · leopard recorded',()=>{playDays(leoDay());S.screen='results';}],
 ['16 · Map · after the leopard',()=>{playDays(leoDay());if(freeSpots().length){S.day++;S.placed=[];S.opened=[];S.screen='map';}else S.screen='results';}],
 ['17 · Map · all spots checked (last morning)',()=>{playDays(lastDay());S.screen='results';}],
 ['18 · Album · last morning',()=>{playDays(lastDay());S.screen='results';S.alb={v:'grid'};}],
 ['19 · Album · leopard enlarged',()=>{playDays(lastDay());S.screen='results';S.alb={v:'photo',id:LEOPARD};}],
 ['20 · End',()=>{playDays(lastDay());S.screen='end';}],
 ['21 · Map · day 2, two layers on',()=>{playDays(1);S.day=2;S.placed=[];S.opened=[];S.screen='map';S.layers={prey:1,rocks:1};}]];
function jumpTo(i){const j=JUMPS[i];if(!j)return;pushHist();clearTimers();clearTimeout(infoT);busy=false;S.nightOn=false;j[1]();S.fresh=false;scr.classList.remove('fade');render();}
const jump=$('#jump');JUMPS.forEach((j,i)=>{const o=document.createElement('option');o.value=i;o.textContent=j[0];jump.appendChild(o);});
jump.addEventListener('change',()=>{if(jump.value!=='')jumpTo(+jump.value);jump.value='';});
$('#back').addEventListener('click',()=>{if(hist.length)restore(hist.pop());});
$('#fwd').addEventListener('click',autoStep);
$('#restart').addEventListener('click',()=>{hist=[];clearTimers();busy=false;S.nightOn=false;newGame();go('idle');});
addEventListener('keydown',e=>{if(e.target.closest('select,input'))return;if(e.key==='ArrowRight')autoStep();else if(e.key==='ArrowLeft'&&hist.length)restore(hist.pop());
 else if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();}});
// Variants (remembered per browser)
const store={get(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const vInact=$('#vInact'),vReveal=$('#vReveal');
(()=>{
 INACTIVITY=store.get('ct-rev-inact','off')==='on';vInact.value=INACTIVITY?'on':'off';})();
vInact.addEventListener('change',()=>{INACTIVITY=vInact.value==='on';store.set('ct-rev-inact',vInact.value);resetIdle();});
vReveal.addEventListener('change',()=>{REVEAL=vReveal.value==='on';if(S.screen==='map')render();});
new ResizeObserver(fit).observe($('#viewport'));
fit();newGame();
window.__proto={S,JUMPS,jumpTo,autoStep,render};
(document.fonts&&document.fonts.load?Promise.all(['600 52px Inter','700 30px Inter','500 13px Roboto'].map(f=>document.fonts.load(f))):Promise.resolve()).then(render,render);
</script>

--c-prey:#e8892b;--c-roads:#d64545;--c-terrain:#1f8a8a;--c-cor:#7b4fc9;--c-veg:#3e8e3e}
*{box-sizing:border-box;margin:0;padding:0}
/* ===== Review bar (same as the other ILMI prototypes) ===== */
:root{--bg:#e9e8e4;--fg:#1c1c1a;--muted:#5c5b57;--rline:#cbc9c3;--ctl:#ffffff;--well:#d3d1cb;--ui:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151514;--fg:#ebeae6;--muted:#a29f98;--rline:#3a3936;--ctl:#242422;--well:#0d0d0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--fg:#ebeae6;--muted:#a29f98;--rline:#3a3936;--ctl:#242422;--well:#0d0d0c;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rline);font-family:var(--ui);color:var(--fg)}
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl strong{font-size:15px;font-weight:700;letter-spacing:.01em}
.ttl span{font-size:12px;color:var(--muted)}
.hint{flex:1 1 220px;margin:0;font-size:13px;line-height:1.4;color:var(--muted);min-width:0}
.hint b{color:var(--fg);font-weight:600}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls label{font-size:12px;color:var(--muted)}
.ctl{display:inline-flex;align-items:center;gap:8px}
.ctrls select,.ctrls button{font:500 13px var(--ui);color:var(--fg);background:var(--ctl);border:1px solid var(--rline);border-radius:8px;padding:6px 10px;cursor:pointer;max-width:100%}
.ctrls button:focus-visible,.ctrls select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ctrls button:disabled{opacity:.45;cursor:default}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--well);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion: reduce){#stage *,#stage{animation:none!important;transition:none!important}}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#eee}
#screen{position:absolute;inset:0;transition:opacity .25s}
#screen.fade{opacity:0}

.abs{position:absolute}
.glow{position:absolute;background:radial-gradient(ellipse at center,rgba(255,255,255,.97) 38%,rgba(255,255,255,.85) 52%,rgba(255,255,255,0) 71%)}
.glowL{position:absolute;background:radial-gradient(ellipse at 25% 50%,rgba(255,255,255,.96) 35%,rgba(255,255,255,.8) 52%,rgba(255,255,255,0) 72%)}
h1,h2,h3,.bubble h3{text-wrap:balance}p,.lead,.body,.bubble p,.tip span{text-wrap:pretty}
h1.t{font-size:52px;font-weight:600;line-height:1.1;letter-spacing:-.5px}
.lead{font-size:34px;line-height:1.3;color:#333}
.body{font-size:28px;line-height:1.38;color:#333}
.btn{position:absolute;width:400px;height:80px;border-radius:40px;border:none;font:600 36px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.btn.primary[disabled]{background:#c5d0dc;color:#2c4a75;box-shadow:none;cursor:default}
.btn.secondary{background:#fff;color:var(--navy);border:4px solid var(--navy)}
.seq{opacity:0;animation:seqIn .7s ease forwards;animation-delay:var(--d,0s)}
@keyframes seqIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.skipseq .seq{animation:none;opacity:1}
.pawtrk{position:absolute;inset:0;pointer-events:none}
.pawtrk i{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;color:#2b2b2b;opacity:0;animation:pawK 2.8s ease forwards;animation-delay:var(--d)}
.pawtrk i svg{width:40px;height:40px}
@keyframes pawK{0%{opacity:0}12%{opacity:.55}55%{opacity:.55}100%{opacity:0}}
.skipseq .pawtrk{display:none}
.tapstart{animation:tapP 2.2s ease-in-out infinite}
@keyframes tapP{50%{opacity:.35}}
.camdemo{position:absolute;width:480px;height:430px}
.camdemo .shot{left:0;top:0;width:480px;height:300px;border-radius:14px;opacity:0;transform:scale(.85);transition:opacity .35s .25s,transform .35s .25s}
.camdemo .shot .d{font-size:21px;margin-top:10px}
.camdemo .flash{position:absolute;left:-30px;top:-30px;width:540px;height:360px;border-radius:30px;background:#fff;opacity:0;pointer-events:none}
.camdemo .cambtn{position:absolute;left:170px;top:80px;width:140px;height:140px;border-radius:50%;border:6px solid #fff;background:var(--navy);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:left .4s,top .4s,width .4s,height .4s;animation:camP 1.6s ease-in-out infinite}
@keyframes camP{0%{box-shadow:0 6px 18px rgba(0,0,0,.3),0 0 0 0 rgba(29,49,87,.45)}100%{box-shadow:0 6px 18px rgba(0,0,0,.3),0 0 0 34px rgba(29,49,87,0)}}
.camdemo .camhint{position:absolute;left:0;right:0;top:250px;text-align:center;font:600 26px Inter;color:#1d3157;transition:top .4s}
.camdemo.done .shot{opacity:1;transform:none}
.camdemo.done .cambtn{left:0;top:330px;width:84px;height:84px;animation:none}
.camdemo.done .cambtn svg{width:42px;height:42px}
.camdemo.done .camhint{top:356px;left:104px;text-align:left}
.camdemo.fl .flash{animation:flashK .5s ease-out}
@keyframes flashK{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.camdemo.static .shot,.camdemo.static .cambtn,.camdemo.static .camhint{transition:none}
.i2b{opacity:0;transition:opacity .6s .5s}.i2b.show{opacity:1}
.i2ic{display:flex;align-items:center;gap:10px;font:600 22px Inter;color:#333}
.i2ic span{width:46px;height:46px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.i2ic span.day{background:#fff;border:3px solid var(--navy);color:var(--navy);font:700 20px Inter}
.i2ic b{margin:0 22px 0 4px;font-weight:600}
.ovl.i3l{opacity:.5;animation:i3lIn .5s ease}
@keyframes i3lIn{from{opacity:0}to{opacity:.5}}
@media (prefers-reduced-motion: reduce){.seq{opacity:1!important}.pawtrk{display:none}}
.dots{position:absolute;display:flex;gap:16px}
.dots i{width:28px;height:28px;border-radius:50%;background:#cfcfcf;display:block;box-shadow:0 0 0 4px rgba(255,255,255,.92)}
.dots i.on{background:var(--navy)}
.badge{position:absolute;background:var(--prov);color:#fff;font:700 15px Inter;padding:8px 14px;border-radius:8px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.pill{position:absolute;background:#fff;border-radius:22px;padding:0 30px;height:76px;display:flex;align-items:center;font-size:32px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* map */
svg.layers{position:absolute;inset:0;pointer-events:none}
.marker{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:none;background:none;cursor:pointer;padding:0}
.marker .c{position:absolute;left:10px;top:10px;width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.marker.free .c{background:rgba(255,255,255,.72);border:5px dashed #2b2b2b}
.marker.placed .c{background:var(--navy);border:5px solid #fff;color:#fff}
.marker.locked .c{background:rgba(200,200,200,.9);border:4px solid #8a8a8a;color:#6b6b6b}
.marker .n{position:absolute;left:50%;top:112px;transform:translateX(-50%);white-space:nowrap;padding:5px 14px;border-radius:999px;background:#2b2b2b;color:#fff;font:600 21px Inter;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.marker.placed .c{cursor:grab;touch-action:none}
.marker.drop .c{box-shadow:0 0 0 6px rgba(255,255,255,.9)}
.marker.over .c{transform:scale(1.15);background:#fff;border-style:solid;border-color:var(--navy)}

 for(let i=0;i<N;i++){const t=i/N*2*Math.PI,k=1+(r()-.5)*.16;const u=Math.cos(t)*rx*k,v=Math.sin(t)*ry*k;

}
function smoothLine(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
 d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return d;}
const DEFS=`<defs>
<pattern id="pDots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.2" fill="#b85f0e"/><circle cx="16" cy="16" r="3.2" fill="#b85f0e"/></pattern>
<pattern id="pHoriz" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 4h16" stroke="#a52a2a" stroke-width="3"/></pattern>
<pattern id="pDiag" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v18" stroke="#0f5e5e" stroke-width="4"/></pattern>
<pattern id="pCross" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 10h20M10 0v20" stroke="#226622" stroke-width="2.5"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10z" fill="#4b2a8a"/></marker>
</defs>`;
function layerSVG(){
 const L=S.layers;let g='';
 const blobs=(id,hex,pat,seed)=>GEO[id].map((b,i)=>{const d=blobPath(...b,seed+i*7);return `<path d="${d}" fill="${hex}" fill-opacity=".28"/><path d="${d}" fill="url(#${pat})" fill-opacity=".55"/><path d="${d}" fill="none" stroke="${hex}" stroke-width="4" stroke-dasharray="14 8"/>`}).join('');
 if(L.veg)g+=`<g>${blobs('veg','#3e8e3e','pCross',11)}</g>`;
 if(L.terrain)g+=`<g>${blobs('terrain','#1f8a8a','pDiag',23)}${GEO.terrain.map(b=>`<ellipse cx="${b[0]}" cy="${b[1]}" rx="${b[2]*.55}" ry="${b[3]*.5}" transform="rotate(${b[4]} ${b[0]} ${b[1]})" fill="none" stroke="#0f5e5e" stroke-width="2.5" stroke-opacity=".7"/>`).join('')}</g>`;
 if(L.prey)g+=`<g>${blobs('prey','#e8892b','pDots',41)}</g>`;
 if(L.roads)g+=`<g>${GEO.roads.map(p=>{const d=smoothLine(p);return `<path d="${d}" fill="none" stroke="#d64545" stroke-opacity=".22" stroke-width="220" stroke-linecap="round"/><path d="${d}" fill="none" stroke="url(#pHoriz)" stroke-opacity=".5" stroke-width="220" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#4a4a4a" stroke-width="20" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="18 14"/>`}).join('')}</g>`;
 if(L.cor)g+=`<g>${GEO.cor.map(p=>{const d=smoothLine(p);return `<path d="${d}" fill="none" stroke="#7b4fc9" stroke-opacity=".25" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#4b2a8a" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round"/>`}).join('')}
 ${[[540,508,25],[985,325,-35],[1440,318,15],[1500,600,125],[1195,822,140]].map(([x,y,r])=>`<path d="M${x-22},${y-14}L${x+18},${y}L${x-22},${y+14}" transform="rotate(${r} ${x} ${y})" fill="none" stroke="#4b2a8a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</g>`;
 return `<svg class="layers" viewBox="0 0 1920 1080">${DEFS}${g}</svg>`;
}
function swatch(c){const fill=c.id==='cor'?`<rect width="40" height="28" rx="6" fill="${c.hex}" fill-opacity=".3"/><path d="M4 14h32" stroke="#4b2a8a" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round"/>`:c.id==='roads'?`<rect width="40" height="28" rx="6" fill="${c.hex}" fill-opacity=".25"/><rect width="40" height="28" rx="6" fill="url(#pHoriz)" fill-opacity=".5"/><path d="M0 14h40" stroke="#4a4a4a" stroke-width="7"/>`:`<rect width="40" height="28" rx="6" fill="${c.hex}" fill-opacity=".3"/><rect width="40" height="28" rx="6" fill="url(#${c.pat})" fill-opacity=".6"/><rect x="1.5" y="1.5" width="37" height="25" rx="5" fill="none" stroke="${c.hex}" stroke-width="3" stroke-dasharray="6 3"/>`;
 return `<svg width="40" height="28" viewBox="0 0 40 28">${DEFS}${fill}</svg>`;}

/* ---------- markers & map ---------- */
function markers(mode){
 return POS.slice(1).map((p,i)=>{const n=i+1;let st='free',inner='';
  if(mode==='night'&&S.history.at(-1).pos.includes(n)){st='placed';}
  else if(S.locked.includes(n)){st='locked';inner=IC.lock(42);}
  else if(S.placed.includes(n)){st='placed';inner=IC.cam(52);}
  if(mode==='night'&&st==='placed'){inner=IC.cam(52);}
  const rv=S.cfg.reveal?` reveal" data-r="${POS[n].c.join('')}${n===S.leopard?' 🐆':''}`:'';
  return `<button class="marker ${st}" data-pos="${n}" style="left:${p.x}px;top:${p.y}px" aria-label="${POS[n].terrain}"><span class="c${rv}">${inner}</span><span class="n">${POS[n].terrain}</span></button>`}).join('');}
function counter(){const left=3-S.placed.length;return `<div class="counter" id="ctr">Camera-traps ${[0,1,2].map(i=>i<left?`<span class="slot av" data-drag="tray">${IC.cam(36)}</span>`:`<span class="slot">${IC.cam(36)}</span>`).join('')} ${S.placed.length}/3</div>`;}
function zoneWin(){const n=S.zone;if(!n||S.screen!=='map')return '';const p=POS[n];
 const right=p.x<1250,left=right?p.x+125:p.x-125-540,top=Math.max(172,Math.min(p.y-120,640));

 return `<div class="zwin" style="left:${left}px;top:${top}px"><button class="x" data-act="zclose" aria-label="Close">×</button><h3>${p.terrain}</h3><p>${p.info}</p><div class="zs">${st}</div></div>`;}
function layerImgs(){const on=CRIT.filter(c=>S.layers[c.id]);if(!on.length)return '';return '<div class="veil"></div>'+on.map(c=>`<img class="ovl" alt="" src="${OVL[c.id]}">`).join('');}

const DRAG={on:false,justDropped:false};
function toCanvas(e){const r=$('#stage').getBoundingClientRect(),k=r.width/1920;return {x:(e.clientX-r.left)/k,y:(e.clientY-r.top)/k};}
function spotAt(pt){let best=0,bd=85;for(let n=1;n<POS.length;n++){const d=Math.hypot(POS[n].x-pt.x,POS[n].y-pt.y);if(d<bd){bd=d;best=n;}}return best;}

 if(S.screen!=='map'||S.busy||S.tut===1)return;
 const tray=e.target.closest('[data-drag="tray"]'),mk=e.target.closest('.marker.placed');
 if(!tray&&!mk)return;
 Object.assign(DRAG,{src:tray?0:+mk.dataset.pos,start:toCanvas(e),on:false,pid:e.pointerId,ghost:null,over:0});
 e.preventDefault();
});
window.addEventListener('pointermove',e=>{
 if(DRAG.pid!==e.pointerId||DRAG.src===undefined)return;const pt=toCanvas(e);
 if(!DRAG.on){if(Math.hypot(pt.x-DRAG.start.x,pt.y-DRAG.start.y)<10)return;
  DRAG.on=true;if(S.tut===2)endTut(false);S.zone=0;rerender();
  if(DRAG.src)document.querySelector(`.marker[data-pos="${DRAG.src}"]`)?.classList.add('lifted');
  document.querySelectorAll('.marker.free').forEach(m=>m.classList.add('drop'));
  const g=document.createElement('div');g.className='ghost';g.innerHTML=IC.cam(52);scr.appendChild(g);DRAG.ghost=g;}
 DRAG.ghost.style.left=pt.x+'px';DRAG.ghost.style.top=pt.y+'px';
 const n=spotAt(pt);if(n!==DRAG.over){document.querySelector('.marker.over')?.classList.remove('over');DRAG.over=n;
  if(n&&!S.placed.includes(n)&&!S.locked.includes(n))document.querySelector(`.marker[data-pos="${n}"]`)?.classList.add('over');}
});
function endDrag(e){
 if(DRAG.pid!==e.pointerId||DRAG.src===undefined)return;const src=DRAG.src;DRAG.src=undefined;DRAG.pid=null;
 if(!DRAG.on)return;DRAG.on=false;DRAG.justDropped=true;setTimeout(()=>DRAG.justDropped=false,50);
 DRAG.ghost?.remove();const n=e.type==='pointercancel'?0:spotAt(toCanvas(e));
 if(n&&S.locked.includes(n)){rerender();const el=document.querySelector(`.marker[data-pos="${n}"]`);el?.classList.add('err');toast('Already checked. Choose a new spot.');return;}
 if(n&&n!==src&&S.placed.includes(n)){rerender();toast('There is already a camera-trap there.');return;}
 if(src)S.placed=S.placed.filter(x=>x!==src);   // lift from old spot (dropped outside = removed)
 if(n&&!S.placed.includes(n))S.placed.push(n);
 rerender();
}

function tapMarker(n,el){
 if(S.locked.includes(n)){el.classList.remove('err');void el.offsetWidth;el.classList.add('err');toast('Already checked. Choose a new spot.');return;}
 if(S.placed.includes(n)){S.placed=S.placed.filter(x=>x!==n);rerender();return;}
 if(S.placed.length>=3){toast('You have 3 camera-traps. Tap one to move it.');const c=$('#ctr');c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');return;}
 S.placed.push(n);rerender();
}
function toggleLayer(id){
 const now=Date.now();S.layers[id]^=1;roundMet.toggles++;
 if(S.layers[id]){roundMet.layerOn[id]=now;}else{roundMet.layerMs[id]=(roundMet.layerMs[id]||0)+(now-roundMet.layerOn[id]);delete roundMet.layerOn[id];}

function doWait(){

 for(const id in roundMet.layerOn){roundMet.layerMs[id]=(roundMet.layerMs[id]||0)+(now-roundMet.layerOn[id]);roundMet.layerOn[id]=now;}
 roundMet.t1=now;roundMet.pos=[...S.placed];
 const found=S.placed.includes(S.leopard);
 S.history.push({round:S.round,pos:[...S.placed].sort((a,b)=>a-b),found});
 S.met.rounds.push({...roundMet,layersActiveAtWait:Object.keys(S.layers).filter(k=>S.layers[k])});
 // keep layers ON across rounds (state of toolbar persists); restart timers for next round
 S.locked.push(...S.placed);S.sel=0;

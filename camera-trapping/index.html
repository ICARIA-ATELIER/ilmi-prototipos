:root{--navy:#1f3557;--navy2:#2c4a75;--ink:#2b2b2b;--mute:#6b6b6b;--line:#d9d9d9;--ok:#2e8b57;--ko:#d64545;--prov:#f08c1e;
--c-prey:#e8892b;--c-roads:#d64545;--c-terrain:#1f8a8a;--c-cor:#7b4fc9;--c-veg:#3e8e3e}
*{box-sizing:border-box;margin:0;padding:0}
/* ===== Review bar (same as the other ILMI prototypes) ===== */
:root{--bg:#e9e8e4;--fg:#1c1c1a;--muted:#5c5b57;--rline:#cbc9c3;--ctl:#ffffff;--well:#d3d1cb;--ui:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151514;--fg:#ebeae6;--muted:#a29f98;--rline:#3a3936;--ctl:#242422;--well:#0d0d0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--fg:#ebeae6;--muted:#a29f98;--rline:#3a3936;--ctl:#242422;--well:#0d0d0c;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rline);font-family:var(--ui);color:var(--fg)}
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl strong{font-size:15px;font-weight:700;letter-spacing:.01em}
.ttl span{font-size:12px;color:var(--muted)}
.hint{flex:1 1 220px;margin:0;font-size:13px;line-height:1.4;color:var(--muted);min-width:0}
.hint b{color:var(--fg);font-weight:600}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls label{font-size:12px;color:var(--muted)}
.ctl{display:inline-flex;align-items:center;gap:8px}
.ctrls select,.ctrls button{font:500 13px var(--ui);color:var(--fg);background:var(--ctl);border:1px solid var(--rline);border-radius:8px;padding:6px 10px;cursor:pointer;max-width:100%}
.ctrls button:focus-visible,.ctrls select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ctrls button:disabled{opacity:.45;cursor:default}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--well);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion: reduce){#stage *,#stage{animation:none!important;transition:none!important}}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#eee}
#screen{position:absolute;inset:0;transition:opacity .25s}
#screen.fade{opacity:0}

.abs{position:absolute}
.glow{position:absolute;background:radial-gradient(ellipse at center,rgba(255,255,255,.97) 38%,rgba(255,255,255,.85) 52%,rgba(255,255,255,0) 71%)}
.glowL{position:absolute;background:radial-gradient(ellipse at 25% 50%,rgba(255,255,255,.96) 35%,rgba(255,255,255,.8) 52%,rgba(255,255,255,0) 72%)}
h1.t{font-size:52px;font-weight:600;line-height:1.1;letter-spacing:-.5px}
.lead{font-size:34px;line-height:1.3;color:#333}
.body{font-size:28px;line-height:1.38;color:#333}
.btn{position:absolute;width:400px;height:80px;border-radius:40px;border:none;font:600 36px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.btn.primary[disabled]{background:#c5d0dc;color:#2c4a75;box-shadow:none;cursor:default}
.btn.secondary{background:#fff;color:var(--navy);border:4px solid var(--navy)}
.dots{position:absolute;display:flex;gap:16px}
.dots i{width:28px;height:28px;border-radius:50%;background:#cfcfcf;display:block}
.dots i.on{background:var(--navy)}
.badge{position:absolute;background:var(--prov);color:#fff;font:700 15px Inter;padding:8px 14px;border-radius:8px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.pill{position:absolute;background:#fff;border-radius:22px;padding:0 30px;height:76px;display:flex;align-items:center;font-size:32px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* map */
svg.layers{position:absolute;inset:0;pointer-events:none}
.marker{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:none;background:none;cursor:pointer;padding:0}
.marker .c{position:absolute;left:10px;top:10px;width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.marker.free .c{background:rgba(255,255,255,.72);border:5px dashed #2b2b2b}
.marker.placed .c{background:var(--navy);border:5px solid #fff;color:#fff}
.marker.locked .c{background:rgba(200,200,200,.9);border:4px solid #8a8a8a;color:#6b6b6b}
.marker .n{position:absolute;right:4px;top:0;width:44px;height:44px;border-radius:50%;background:#2b2b2b;color:#fff;font:700 24px Inter;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.marker.err .c{animation:shake .4s;background:var(--ko)!important}
.marker.reveal .c::after{content:attr(data-r);position:absolute;top:104px;font:700 16px Inter;background:#000;color:#ff0;padding:2px 6px;border-radius:4px;white-space:nowrap}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.toolbar{position:absolute;left:790px;top:40px;height:94px;background:rgba(255,255,255,.92);border-radius:47px;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.tog{height:70px;border-radius:35px;border:3px solid var(--navy);background:#fff;color:var(--navy);font:600 28px Inter;display:flex;align-items:center;gap:10px;padding:0 22px 0 18px;cursor:pointer}
.tog.on{background:var(--lc);border-color:var(--lc);color:#fff}
.tog .sw{width:22px;height:22px;border-radius:6px;border:2px solid #fff;display:none}
.tog.on .sw{display:block}
.legend{position:absolute;left:40px;bottom:150px;background:rgba(255,255,255,.95);border-radius:14px;padding:16px 22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.legend div{display:flex;align-items:center;gap:12px;font:600 22px Inter}
.legend svg{flex:none}
.counter{position:absolute;left:640px;top:950px;width:605px;height:94px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:22px;font:600 32px Inter;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.counter.pulse{animation:pulse .5s 2}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(214,69,69,.35)}}
.slot{width:62px;height:62px;border-radius:10px;border:3px dashed #9a9a9a;display:flex;align-items:center;justify-content:center;color:#9a9a9a}
.slot.f{border:3px solid var(--navy);background:var(--navy);color:#fff}
.toast{position:absolute;left:50%;top:820px;transform:translateX(-50%);background:#2b2b2b;color:#fff;font:600 30px Inter;padding:24px 40px;border-radius:18px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
/* results */
.thumb{position:absolute;left:120px;width:390px;height:230px;border-radius:6px;cursor:pointer;background:#fff;overflow:hidden;border:6px solid transparent}
.thumb.sel{border-color:var(--navy)}
.thumb .lab{height:38px;background:#eee;font:600 21px Inter;padding:6px 10px;white-space:nowrap;overflow:hidden}
.ph{position:absolute;background:#3a3a3a;color:#e6e6e6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.ph .hud{position:absolute;left:24px;bottom:18px;font:600 22px Inter;color:#eee;letter-spacing:.5px}
.ph .d{font-size:24px;line-height:1.35;max-width:80%;margin-top:18px}
.ph.lp{background:#2a3324}
.infobar{position:absolute;left:560px;top:760px;width:1240px;height:180px;background:#fff;padding:22px 30px}
.crit{display:flex;gap:14px}
.crit span{position:relative;width:62px;height:62px;border-radius:50%;border:3px solid #aaa;display:flex;align-items:center;justify-content:center;color:#888;background:#eee}
.crit span.y{border-color:var(--ok);color:var(--ok);background:#fff}
.crit span b{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;color:#fff;font:700 16px Inter;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.crit span.y b{background:var(--ok)}.crit span.n b{background:var(--ko)}
.crit.sm{gap:8px}.crit.sm span{width:40px;height:40px;border-width:2px}.crit.sm span svg{width:22px;height:22px}.crit.sm span b{width:20px;height:20px;font-size:12px;right:-6px;top:-6px}
/* night */
.night{position:absolute;inset:0;background:rgba(28,36,62,.78);transition:background 1.2s}
.night.morning{background:rgba(255,214,150,.18)}
/* field report */
.card{position:absolute;background:#fff;border-radius:18px;border:2px solid #bbb}
.tile{position:absolute;top:870px;width:176px;height:150px;border-radius:14px;background:#fff;border:3px solid #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:600 21px Inter;text-align:center;cursor:pointer;padding:6px;color:var(--navy)}
.tile.lock{background:#e4e4e4;border:3px dashed #aaa;color:#999;cursor:default}
.tile.sel{border:5px solid var(--navy)}
.arrow{position:absolute;top:470px;width:80px;height:80px;border:none;background:none;cursor:pointer;color:#333}
.arrow[disabled]{opacity:.2;cursor:default}
.iucn{display:flex;gap:8px}.iucn i{font:700 22px Inter;font-style:normal;padding:8px 12px;border-radius:6px;background:#e6e6e6;color:#999}.iucn i.on{background:#2b2b2b;color:#fff}
.fact{background:#eee;border-radius:8px;padding:12px 16px}
.fact small{display:block;font:700 18px Inter;color:#555;letter-spacing:.5px;margin-bottom:4px}
.fact div{font-size:24px}
.gcard{position:absolute;width:590px;height:250px;background:#fff;border-radius:10px;border:2px solid #ccc;padding:12px}
.gcard.mine{border:5px solid var(--navy)}
.mine-b{display:inline-block;background:var(--navy);color:#fff;font:600 19px Inter;padding:6px 12px;border-radius:6px;margin-top:10px}
/* map UI v4 */
.ovl{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
.veil{position:absolute;inset:0;background:rgba(255,255,255,.2);pointer-events:none}
.prompt{position:absolute;left:40px;top:40px;width:638px;height:115px;background:rgba(255,255,255,.82);border-radius:14px;padding:12px 22px}
.prompt small{display:block;font:700 16px Inter;color:#555;letter-spacing:.6px}
.prompt b{display:block;font:600 28px Inter;margin-top:2px}
.prompt span{display:block;font-size:20px;color:#555;margin-top:2px}
/* onboarding */
.chipw{position:relative}
.chipw .tog{position:relative}
.chipw .tog.seen,.chipw .tog.cur{background:var(--lc);border-color:var(--lc);color:#fff}
.chipw .tick{position:absolute;right:-10px;top:-12px;width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;font:700 18px Inter;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.tip{position:absolute;top:96px;left:50%;transform:translateX(-50%);width:540px;background:#fff;border-radius:20px;padding:22px 28px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:5;text-align:left}
.tip b{display:block;font:700 28px Inter;margin-bottom:6px}
.tip span{font-size:26px;line-height:1.35;color:#333}
.dim{position:absolute;inset:0;background:rgba(15,20,35,.66);z-index:10}
.hl{z-index:11!important}
.toolbar.hl{box-shadow:0 0 0 6px #fff,0 0 40px 14px rgba(255,255,255,.55)}
.counter.hl{box-shadow:0 0 0 6px #fff}
.marker.hl .c{box-shadow:0 0 0 10px #fff,0 4px 18px 10px rgba(0,0,0,.25)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.95)}100%{box-shadow:0 0 0 28px rgba(255,255,255,0)}}
.bubble{position:absolute;z-index:12;background:#fff;border-radius:24px;padding:28px 34px 24px;box-shadow:0 10px 36px rgba(0,0,0,.35)}
.bubble.up::before{content:'';position:absolute;top:-18px;left:var(--ax,50%);margin-left:-18px;border:18px solid transparent;border-top:none;border-bottom-color:#fff}
.bubble .st{font:600 20px Inter;color:#888;letter-spacing:.5px}
.bubble h3{font:700 36px Inter;margin:6px 0 8px}
.bubble p{font-size:28px;line-height:1.38;color:#333}
.bubble .bb{margin-top:18px;display:flex;justify-content:flex-end}
.bubble .bb button.big{width:100%;height:80px;font-size:36px}
.bubble .bb button.mid{width:400px;height:80px;font-size:36px}
.bubble .bb button{height:64px;padding:0 40px;border-radius:32px;border:none;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;font:600 28px Inter;cursor:pointer}
/* modal */
.modal{position:absolute;inset:0;background:rgba(20,26,40,.6);display:flex;align-items:center;justify-content:center;z-index:30}
.modal .box{width:960px;height:520px;background:#fff;border-radius:22px;position:relative;text-align:center;padding-top:70px}
/* test panel */
#tp{position:absolute;right:12px;top:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;background:#141821;color:#e8e8e8;font:13px/1.45 Inter,sans-serif;border-radius:10px;padding:14px 16px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none}
#tp.open{display:block}
#tp h3{font-size:14px;margin:10px 0 6px;color:#9fb6ff}
#tp h3:first-child{margin-top:0}
#tp button{background:#2c4a75;color:#fff;border:none;border-radius:6px;padding:5px 10px;font:600 12px Inter;cursor:pointer;margin:2px 4px 2px 0}
#tp button.on{background:#f08c1e}
#tp input[type=number]{width:60px;background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:2px 4px}
#tp table{width:100%;border-collapse:collapse;font-size:12px}
#tp td,#tp th{border-bottom:1px solid #2a2f3a;padding:3px 4px;text-align:left;vertical-align:top}
#tp .k{color:#9a9a9a}
#hot{position:absolute;right:0;bottom:0;width:26px;height:26px;z-index:99;cursor:pointer;opacity:.12;background:#fff;border-top-left-radius:8px}
</style>
</head>

/* ---------- SVG layer drawing ---------- */
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function blobPath(cx,cy,rx,ry,rot,seed){
 const r=rng(seed),N=11,pts=[],a0=rot*Math.PI/180;
 for(let i=0;i<N;i++){const t=i/N*2*Math.PI,k=1+(r()-.5)*.16;const u=Math.cos(t)*rx*k,v=Math.sin(t)*ry*k;
  pts.push([cx+u*Math.cos(a0)-v*Math.sin(a0),cy+u*Math.sin(a0)+v*Math.cos(a0)]);}
 let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
 for(let i=0;i<N;i++){const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
  const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
  d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
 return d+'Z';
}
function smoothLine(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
 d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return d;}

</defs>`;

 if(L.veg)g+=`<g>${blobs('veg','#3e8e3e','pCross',11)}</g>`;
 if(L.terrain)g+=`<g>${blobs('terrain','#1f8a8a','pDiag',23)}${GEO.terrain.map(b=>`<ellipse cx="${b[0]}" cy="${b[1]}" rx="${b[2]*.55}" ry="${b[3]*.5}" transform="rotate(${b[4]} ${b[0]} ${b[1]})" fill="none" stroke="#0f5e5e" stroke-width="2.5" stroke-opacity=".7"/>`).join('')}</g>`;
 if(L.prey)g+=`<g>${blobs('prey','#e8892b','pDots',41)}</g>`;
 if(L.roads)g+=`<g>${GEO.roads.map(p=>{const d=smoothLine(p);return `<path d="${d}" fill="none" stroke="#d64545" stroke-opacity=".22" stroke-width="220" stroke-linecap="round"/><path d="${d}" fill="none" stroke="url(#pHoriz)" stroke-opacity=".5" stroke-width="220" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#4a4a4a" stroke-width="20" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="18 14"/>`}).join('')}</g>`;
 if(L.cor)g+=`<g>${GEO.cor.map(p=>{const d=smoothLine(p);return `<path d="${d}" fill="none" stroke="#7b4fc9" stroke-opacity=".25" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#4b2a8a" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round"/>`}).join('')}

};
function tutorial(){
 if(S.tut===1)return `<div class="dim"></div><div class="bubble up" style="left:980px;top:175px;width:900px;--ax:440px"><div class="st">TUTORIAL · 1/2</div><h3>Map layers</h3><p>These buttons show the evidence researchers use. Tap a layer to see it on the map: prey, roads, terrain, animal trails and vegetation. You can turn on several at once.</p><div class="bb"><button class="mid" data-act="tut:2">Next</button></div></div>`;
 if(S.tut===2)return `<div class="dim"></div><div class="bubble" style="left:40px;top:600px;width:500px"><div class="st">TUTORIAL · 2/2</div><h3>Place your camera-traps</h3><p>Tap one of the 9 spots to place a camera-trap. You have 3. Tap it again to remove it.</p><div class="bb"><button class="big" data-act="tut:end">Got it</button></div></div>`;
 return '';}
function critRow(c){return CRIT.map((k,i)=>`<span class="${c[i]?'y':'n'}" title="${k.crit}: ${c[i]?'yes':'no'}">${ic(k.id)}<b>${c[i]?'✓':'✕'}</b></span>`).join('');}
function recorded(){const s=new Set();S.history.forEach(h=>h.pos.forEach(p=>{const k=captureOf(p);if(!SP[k].other)s.add(k)}));return s;}

/* ---------- after-render hooks (timers) ---------- */
const AFTER={
 video:()=>{const b=$('#vbar');const dur=12000,t0=Date.now(),id=NAV.id;(function tick(){if(S.screen!=='video'||NAV.id!==id)return;const k=Math.min(1,(Date.now()-t0)/dur);b.style.width=k*100+'%';if(k<1)requestAnimationFrame(tick);else go('results',{force:true});})();},
 reflect:()=>{autoT=setTimeout(()=>go('idle',{force:true}),12000);}
};

/* ================== INTERACTION ================== */
scr.addEventListener('click',e=>{
 if(S.busy)return;
 if(S.screen==='idle'){newGame();go('i1');return;}
 if(S.screen==='reflect'){go('idle');return;}
 const tp_=e.target.closest('[data-tip]');if(tp_){const id=tp_.dataset.tip;S.tip=id;if(!S.seen.includes(id))S.seen.push(id);if(S.seen.length===CRIT.length&&!S.met.i3)S.met.i3=Date.now()-S.met.i3t0;rerender();return;}
 const m=e.target.closest('.marker');if(m&&S.screen==='map'){if(S.tut===1)return;const wasTut=S.tut===2;if(wasTut)endTut(false);tapMarker(+m.dataset.pos,m);if(wasTut)rerender();return;}
 const l=e.target.closest('[data-layer]');if(l)return toggleLayer(l.dataset.layer);
 const th=e.target.closest('[data-sel]');if(th){S.sel=+th.dataset.sel;rerender();return;}
 const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const act=a.dataset.act;
 if(act.startsWith('go:'))return go(act.slice(3));
 if(act.startsWith('fr:')){S.fr+=+act.slice(3);rerender();return;}
 if(act.startsWith('frk:')){S.fr=+act.slice(4);rerender();return;}
 if(act==='start'){S.round=1;roundMet=null;if(S.cfg.tutorial){S.tut=1;S.tutT0=Date.now();}go('map');return;}
 if(act==='i3go'){S.seen=[];S.tip=null;S.met.i3=null;S.met.i3t0=Date.now();go('i3');return;}
 if(act==='tut:2'){S.tut=2;rerender();return;}
 if(act==='tut:end'){endTut(true);return;}
 if(act==='wait')return doWait();
 if(act==='nextround'){S.round++;S.placed=[];S.sel=0;roundMet=null;go('map');return;}
});
function endTut(re){S.tut=0;const now=Date.now();S.met.tut=now-S.tutT0;if(roundMet){roundMet.t0=now;}if(re)rerender();}
function tapMarker(n,el){
 if(S.locked.includes(n)){el.classList.remove('err');void el.offsetWidth;el.classList.add('err');toast('Already checked. Choose a new spot.');return;}
 if(S.placed.includes(n)){S.placed=S.placed.filter(x=>x!==n);rerender();return;}
 if(S.placed.length>=3){toast('You have 3 camera-traps. Tap one to move it.');const c=$('#ctr');c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');return;}
 S.placed.push(n);rerender();
}
function toggleLayer(id){
 const now=Date.now();S.layers[id]^=1;roundMet.toggles++;
 if(S.layers[id]){roundMet.layerOn[id]=now;}else{roundMet.layerMs[id]=(roundMet.layerMs[id]||0)+(now-roundMet.layerOn[id]);delete roundMet.layerOn[id];}
 rerender();
}
function doWait(){
 if(S.placed.length<3)return;const now=Date.now();
 for(const id in roundMet.layerOn){roundMet.layerMs[id]=(roundMet.layerMs[id]||0)+(now-roundMet.layerOn[id]);roundMet.layerOn[id]=now;}
 roundMet.t1=now;roundMet.pos=[...S.placed];
 const found=S.placed.includes(S.leopard);
 S.history.push({round:S.round,pos:[...S.placed].sort((a,b)=>a-b),found});
 S.met.rounds.push({...roundMet,layersActiveAtWait:Object.keys(S.layers).filter(k=>S.layers[k])});
 // keep layers ON across rounds (state of toolbar persists); restart timers for next round
 S.locked.push(...S.placed);S.sel=0;
 if(found){S.found=true;S.foundRound=S.round;const i=S.history.at(-1).pos.indexOf(S.leopard);S.sel=i;}
 renderPanel();go('night');
}
// Night → leopard? video first
AFTER.night=(()=>{return()=>{autoT=setTimeout(()=>{$('#nt')&&$('#nt').classList.add('morning');const t=$('#ntx');if(t)t.textContent='Morning! Time to check your camera-traps.';
 autoT=setTimeout(()=>go(S.history.at(-1).found?'video':'results',{force:true}),1600);},2400);}})();
// map: carry layer-on timers into a new round
AFTER.map=()=>{if(S.tut===1)$('.toolbar').classList.add('hl');if(S.tut===2){document.querySelectorAll('.marker.free').forEach(m=>m.classList.add('hl'));$('#ctr').classList.add('hl');}
 if(!roundMet){const now=Date.now();roundMet={round:S.round,t0:now,t1:null,layerOn:{},layerMs:{},toggles:0,pos:[]};for(const k in S.layers)if(S.layers[k])roundMet.layerOn[k]=now;}};

/* ================== INACTIVITY (U1) ================== */
const IDLE_SCREENS=['i1','i2','i3','map','results','report'];
let idleT=null,cdT=null;
function resetIdle(){clearTimeout(idleT);if(!S.cfg.timeoutOn||!IDLE_SCREENS.includes(S.screen)||$('#modal').innerHTML)return;idleT=setTimeout(showIdle,S.cfg.timeout*1000);}
function showIdle(){let n=15;const M=$('#modal');
 const draw=()=>{M.innerHTML=`<div class="modal"><div class="box">
  <h1 class="t" style="font-size:52px">Are you still there?</h1><p class="body" style="margin-top:14px">Tap Continue to keep playing.</p>
  <svg width="130" height="130" viewBox="0 0 130 130" style="margin-top:30px"><circle cx="65" cy="65" r="56" fill="none" stroke="#ddd" stroke-width="8"/><circle cx="65" cy="65" r="56" fill="none" stroke="#1f3557" stroke-width="8" stroke-dasharray="${352*n/15} 352" transform="rotate(-90 65 65)"/><text x="65" y="77" text-anchor="middle" font-size="36" font-weight="600" font-family="Inter">${n}</text></svg>
  <button class="btn secondary" data-m="again" style="left:60px;top:400px">Start again</button><button class="btn primary" data-m="cont" style="left:500px;top:400px">Continue</button></div></div>`;};
 draw();cdT=setInterval(()=>{n--;if(n<=0){closeModal(false);newGame();go('idle',{force:true});}else draw();},1000);
}
function closeModal(restart=true){clearInterval(cdT);$('#modal').innerHTML='';if(restart)resetIdle();}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='cont')closeModal();else{closeModal(false);newGame();go('idle',{force:true});}});
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,e=>{if(!$('#modal').innerHTML)resetIdle();},true));

/* ================== TEST PANEL ================== */
const tp=$('#tp');
function fmt(ms){return ms==null?'—':(ms/1000).toFixed(1)+' s'}
function renderPanel(){
 if(!tp.classList.contains('open'))return;
 const live=roundMet&&S.screen==='map'?[{...roundMet,live:true}]:[];
 const rows=[...S.met.rounds,...live].map(r=>{const ms={...r.layerMs};if(r.live)for(const k in r.layerOn)ms[k]=(ms[k]||0)+(Date.now()-r.layerOn[k]);
  const used=Object.keys(ms).filter(k=>ms[k]>0).map(k=>`${CRIT.find(c=>c.id===k).label} ${fmt(ms[k])}`).join('<br>')||'none';
  return `<tr><td>R${r.round}${r.live?' ▸':''}</td><td>${fmt((r.t1||Date.now())-r.t0)}</td><td>${r.pos.length?r.pos.join(','):S.placed.join(',')||'—'}</td><td>${used}<br><span class="k">${r.toggles} toggles</span></td></tr>`}).join('');
 tp.innerHTML=`<h3>Test panel · Prototype B</h3>
 <div class="k">Screen: <b style="color:#fff">${S.screen}</b> · Round ${S.round}/3</div>
 <h3>Leopard position</h3>
 ${['random','1','2','3'].map(v=>`<button data-tp="lp:${v}" class="${S.cfg.leopardFix===v?'on':''}">${v==='random'?'Random':'Pos '+v}</button>`).join('')}
 <div class="k">Current game: leopard at <b style="color:#fff">${S.leopard}</b> (applies from next game)</div>
 <div style="margin-top:6px"><button data-tp="restart">Restart now</button><button data-tp="map">Restart → map (skip intro)</button></div>
 <h3>Inactivity</h3>
 <label><input type="checkbox" data-tp="toOn" ${S.cfg.timeoutOn?'checked':''}> enabled</label> · after <input type="number" min="5" data-tp="toS" value="${S.cfg.timeout}"> s (+15 s countdown)
 <h3>Debug</h3>
 <label><input type="checkbox" data-tp="rev" ${S.cfg.reveal?'checked':''}> show criteria flags + leopard on markers</label><br>
 <label><input type="checkbox" data-tp="tut" ${S.cfg.tutorial?'checked':''}> map tutorial (round 1)</label>
 ${S.screen==='video'?'<div><button data-tp="skipv">Skip video</button></div>':''}
 <h3>Metrics (this game · not saved)</h3>
 <div>Leopard found: <b style="color:#fff">${S.found?'round '+S.foundRound:'not yet'}</b></div>
 <div>Total time: ${S.met.start?fmt(Date.now()-S.met.start):'—'}</div>
 <div>02-3 clues (5 taps): ${fmt(S.met.i3)} · Map tutorial: ${fmt(S.met.tut)}</div>
 <table><tr><th>Round</th><th>Time</th><th>Positions</th><th>Layers used (time on)</th></tr>${rows||'<tr><td colspan=4 class="k">no rounds yet</td></tr>'}</table>
 <div class="k" style="margin-top:8px">Toggle: T key or bottom-right corner.</div>`;
}
setInterval(()=>{if(tp.classList.contains('open')&&S.screen==='map')renderPanel();},1000);
function togglePanel(){tp.classList.toggle('open');renderPanel();}
addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')togglePanel();});
$('#hot').addEventListener('click',togglePanel);
tp.addEventListener('click',e=>{const b=e.target.closest('[data-tp]');if(!b)return;const v=b.dataset.tp;
 if(v.startsWith('lp:')){S.cfg.leopardFix=v.slice(3);renderPanel();}
 else if(v==='restart'){newGame();S.busy=false;go('idle',{force:true});}
 else if(v==='map'){newGame();S.busy=false;if(S.cfg.tutorial){S.tut=1;S.tutT0=Date.now();}go('map',{force:true});}
 else if(v==='skipv'){go('results',{force:true});}
});
tp.addEventListener('change',e=>{const v=e.target.dataset.tp;
 if(v==='toOn'){S.cfg.timeoutOn=e.target.checked;setInact(S.cfg.timeoutOn?'on':'off');resetIdle();}
 if(v==='toS'){S.cfg.timeout=Math.max(5,+e.target.value||60);resetIdle();}
 if(v==='tut'){S.cfg.tutorial=e.target.checked;}
 if(v==='rev'){S.cfg.reveal=e.target.checked;if(S.screen==='map')rerender();}
 renderPanel();});

/* ================== REVIEW BAR (← Back / Next →, Go to, Variants, Reset) ================== */
const NAV={past:[],future:[],cur:null,paused:false,id:0};
function snapS(){const c=JSON.parse(JSON.stringify(S));delete c.cfg;delete c.met;c._rm=roundMet?JSON.parse(JSON.stringify(roundMet)):null;return c;}
function restoreS(c){const k=JSON.parse(JSON.stringify(c));roundMet=k._rm;delete k._rm;Object.assign(S,k);S.busy=false;}
// what each screen asks the reviewer to do
function hintOf(){
 const s=S.screen,r=S.round;
 if(s==='idle')return '<b>Tap the screen</b> to start.';
 if(s==='i1'||s==='i2')return 'Intro '+(s==='i1'?'1':'2')+'/3. Tap <b>Next</b>.';
 if(s==='i3')return 'Intro 3/3 (02-3). <b>Tap each of the 5 clues</b> to read why it matters. <b>Start</b> turns on when all 5 have been explored ('+S.seen.length+'/5).';
 if(s==='map'){if(S.tut===1)return 'Map tutorial 1/2 (round 1 only). Try the <b>layer buttons</b>, then tap <b>Next</b> in the bubble.';
  if(S.tut===2)return 'Map tutorial 2/2. Tap <b>Got it</b>, or tap a spot: it already places a camera-trap.';
  return 'Round '+r+'/3. Turn <b>map layers</b> on and off and <b>tap 3 spots</b> to place the camera-traps (tap again to remove). Then <b>Wait for next day</b>.'+(r>1?' Spots already checked are locked.':'');}
 if(s==='night')return 'Night → morning, by itself (about 4 s).';
 if(s==='results'){const f=S.history.length&&S.history.at(-1).found;return 'Day results. <b>Tap a photo</b> on the left to see it big with its 5 criteria. Then <b>'+(f?'Field report':'Next round')+'</b>.';}
 if(s==='video')return 'Placeholder for the real camera-trap video (12 s). Goes on to the day results by itself.';
 if(s==='report')return 'Field report: the 7 species. Browse with the <b>arrows</b> or the <b>tiles</b>, then <b>Finish</b>.';
 if(s==='reflect')return 'Goes back to the attract screen after 12 s, or <b>tap the screen</b>.';
 return '';}
function showHint(){const h=document.getElementById('hint');if(!h)return;
 h.innerHTML=(NAV.paused?'<b>Paused</b> (Back / Next, or tap the screen to continue). ':'')+hintOf();
 document.getElementById('back').disabled=!NAV.past.length;}
// screens that only move on by themselves: when paused, show their final look without timers
const AFTER_STATIC={night:()=>{const n=$('#nt');if(n)n.classList.add('morning');const t=$('#ntx');if(t)t.textContent='Morning! Time to check your camera-traps.';}};
function navTo(c){clearTimeout(autoT);closeModal(false);restoreS(c);NAV.paused=true;render();resetIdle();}
function back(){if(!NAV.past.length)return;NAV.future.push(NAV.cur);navTo(NAV.past.pop());}
function freeSpots(){return [1,2,3,4,5,6,7,8,9].filter(n=>!S.locked.includes(n));}
function fwd(){
 if(NAV.future.length){NAV.past.push(NAV.cur);navTo(NAV.future.pop());return;}
 S.busy=false;const s=S.screen,f={force:true};
 if(s==='idle'){newGame();go('i1',f);}
 else if(s==='i1')go('i2',f);
 else if(s==='i2'){S.seen=[];S.tip=null;S.met.i3=null;S.met.i3t0=Date.now();go('i3',f);}
 else if(s==='i3'){S.seen=CRIT.map(c=>c.id);S.tip=null;S.round=1;roundMet=null;if(S.cfg.tutorial){S.tut=1;S.tutT0=Date.now();}go('map',f);}
 else if(s==='map'){
  if(S.tut===1){S.tut=2;render();return;}
  if(S.tut===2){endTut(true);return;}
  if(S.placed.length<3){for(const n of (S.round<3?freeSpots().filter(p=>p!==S.leopard):freeSpots()))if(S.placed.length<3&&!S.placed.includes(n))S.placed.push(n);render();}
  doWait();}
 else if(s==='night')go(S.history.at(-1).found?'video':'results',f);
 else if(s==='video')go('results',f);
 else if(s==='results'){if(S.history.at(-1).found)go('report',f);else{S.round++;S.placed=[];S.sel=0;roundMet=null;go('map',f);}}
 else if(s==='report')go('reflect',f);
 else if(s==='reflect')go('idle',f);
 NAV.paused=true;showHint();}
// "Go to": each entry builds a consistent game state first
function playRound(pos){S.placed=pos.slice();roundMet={round:S.round,t0:Date.now(),t1:null,layerOn:{},layerMs:{},toggles:0,pos:[]};
 const now=Date.now();roundMet.t1=now;roundMet.pos=[...pos];const found=pos.includes(S.leopard);
 S.history.push({round:S.round,pos:[...pos].sort((a,b)=>a-b),found});S.met.rounds.push({...roundMet,layersActiveAtWait:[]});
 S.locked.push(...pos);S.sel=0;if(found){S.found=true;S.foundRound=S.round;S.sel=S.history.at(-1).pos.indexOf(S.leopard);}}
function noLeopard(n){return freeSpots().filter(p=>p!==S.leopard).slice(0,n);}
const JUMP=[
 ['idle','1 · Attract screen',()=>{newGame();}],
 ['i1','2 · Intro · Is the leopard easy to find?',()=>{newGame();}],
 ['i2','3 · Intro · What is a camera-trap?',()=>{newGame();}],
 ['i3','4 · Intro · How researchers choose a spot (02-3)',()=>{newGame();S.met.i3t0=Date.now();}],
 ['map','5 · Round 1 · Tutorial 1/2 (map layers)',()=>{newGame();S.seen=CRIT.map(c=>c.id);S.tut=1;S.tutT0=Date.now();}],
 ['map','6 · Round 1 · Tutorial 2/2 (place)',()=>{newGame();S.seen=CRIT.map(c=>c.id);S.tut=2;S.tutT0=Date.now();}],
 ['map','7 · Round 1 · Map (no tutorial)',()=>{newGame();S.seen=CRIT.map(c=>c.id);}],
 ['map','8 · Round 1 · All 5 layers on, 3 placed',()=>{newGame();S.seen=CRIT.map(c=>c.id);for(const k in S.layers)S.layers[k]=1;S.placed=noLeopard(3);}],
 ['night','9 · Night → morning',()=>{newGame();playRound(noLeopard(3));}],
 ['results','10 · Day results · no leopard (round 1)',()=>{newGame();playRound(noLeopard(3));}],
 ['map','11 · Round 2 · Map (checked spots locked)',()=>{newGame();playRound(noLeopard(3));S.round=2;S.placed=[];}],
 ['map','12 · Round 3 · Only 3 spots left',()=>{newGame();playRound(noLeopard(3));S.round=2;playRound(noLeopard(3));S.round=3;S.placed=[];}],
 ['video','13 · Leopard video (placeholder)',()=>{newGame();playRound(noLeopard(3));S.round=2;playRound([S.leopard,...noLeopard(2)]);}],
 ['results','14 · Day results · leopard recorded',()=>{newGame();playRound(noLeopard(3));S.round=2;playRound([S.leopard,...noLeopard(2)]);}],
 ['report','15 · Field report (7 species)',()=>{newGame();playRound([S.leopard,...noLeopard(2)]);}],
 ['reflect','16 · Reflection',()=>{newGame();playRound([S.leopard,...noLeopard(2)]);}],
 ['_idle','17 · Unhappy · Inactivity “Are you still there?”',()=>{newGame();S.seen=CRIT.map(c=>c.id);}]
];
const jumpSel=document.getElementById('jump');
JUMP.forEach(([,label],i)=>{const o=document.createElement('option');o.value=i;o.textContent=label;jumpSel.appendChild(o);});
jumpSel.addEventListener('change',()=>{const v=jumpSel.value;jumpSel.value='';if(v==='')return;const [scr_,,setup]=JUMP[+v];
 clearTimeout(autoT);closeModal(false);S.busy=false;setup();roundMet=null;
 if(scr_==='_idle'){go('map',{force:true});setTimeout(()=>{clearTimeout(idleT);showIdle();},300);return;}
 go(scr_,{force:true});});
document.getElementById('back').addEventListener('click',back);
document.getElementById('fwd').addEventListener('click',fwd);
document.getElementById('restart').addEventListener('click',()=>{clearTimeout(autoT);closeModal(false);newGame();S.busy=false;NAV.past=[];NAV.future=[];NAV.cur=null;NAV.paused=false;S.screen='idle';render();});
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('select,input'))return;
 if(e.key==='ArrowLeft'){e.preventDefault();back();}else if(e.key==='ArrowRight'){e.preventDefault();fwd();}});
// tapping the stage while paused resumes the screens that move on by themselves
$('#stage').addEventListener('click',()=>{if(!NAV.paused)return;NAV.paused=false;showHint();
 if(['night','video','reflect'].includes(S.screen)){clearTimeout(autoT);render();}},true);
// Variants · inactivity (off by default; remembered per browser)
const INACT_KEY='proto-wr1-801-ia02-inactivity';
const inactSel=document.getElementById('vInact');
function setInact(v){S.cfg.timeoutOn=v==='on';inactSel.value=v;try{localStorage.setItem(INACT_KEY,v);}catch(e){}resetIdle();renderPanel();}
(()=>{let v='off';try{v=localStorage.getItem(INACT_KEY)==='on'?'on':'off';}catch(e){}S.cfg.timeoutOn=v==='on';inactSel.value=v;})();
inactSel.addEventListener('change',()=>setInact(inactSel.value));
new ResizeObserver(fit).observe(document.getElementById('viewport'));

fit();newGame();
// positions depend on text size: wait for the fonts before the first screen
(document.fonts&&document.fonts.load?Promise.all(['600 52px Inter','600 36px Inter','500 13px Roboto'].map(f=>document.fonts.load(f))):Promise.resolve()).then(render,render);
</script>
